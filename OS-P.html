    };

    /* =======================================================================
     * #8 GUI WINDOW MANAGER (Drag, Resize, Z-Index, Min/Max/Close)
     * ======================================================================= */
    const WindowManager = {
      windows: {}, // appId -> { id, el, z, minimized, maximized, prevRect }
      zCounter: 100,
      focusedId: null,
      spawnOffset: 0,

      openApp(appId) {
        DesktopUI.toggleStartMenu(false);
        const app = APP_REGISTRY[appId];
        if (!app) return;

        // If already open, restore & focus
        if (this.windows[appId]) {
          const w = this.windows[appId];
          if (w.minimized) {
            w.minimized = false;
            w.el.classList.remove('hidden');
          }
          this.focusWindow(appId);
          this.renderTaskbar();
          return;
        }

        // Fork a process entry for this GUI app
        const forkRes = Kernel.syscall(SYSCALL.SYS_FORK, { name: `app:${appId}` }, 42);
        const pid = forkRes.data ? forkRes.data.pid : 100;

        // Calculate responsive initial dimensions & position
        const vw = window.innerWidth;
        const vh = window.innerHeight - 52;
        const wWidth = Math.min(app.defaultW, vw - 24);
        const wHeight = Math.min(app.defaultH, vh - 24);
        const offset = (this.spawnOffset++ % 6) * 26;
        const left = Math.max(12, Math.min(vw - wWidth - 12, (vw > 900 ? 210 : 12) + offset));
        const top = Math.max(12, Math.min(vh - wHeight - 12, 18 + offset));

        const winEl = document.createElement('div');
        winEl.id = `win-${appId}`;
        winEl.className = 'os-window pointer-events-auto';
        winEl.style.width = `${wWidth}px`;
        winEl.style.height = `${wHeight}px`;
        winEl.style.left = `${left}px`;
        winEl.style.top = `${top}px`;

        winEl.innerHTML = `
          <div class="win-titlebar h-10 shrink-0 px-3 bg-[#111827] border-b border-slate-800 flex items-center justify-between gap-2 cursor-move select-none">
            <div class="flex items-center gap-2 min-w-0">
              <span class="${app.color} shrink-0">${app.icon}</span>
              <span class="text-xs sm:text-sm font-semibold text-slate-100 truncate">${escapeHtml(app.title)}</span>
              <span class="hidden sm:inline text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">${escapeHtml(app.tag)}</span>
              <span class="hidden md:inline text-[10px] font-mono text-slate-500">PID ${pid}</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              <button type="button" onclick="WindowManager.minimizeWindow('${appId}')" title="Minimize" class="w-6 h-6 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-xs transition">&minus;</button>
              <button type="button" onclick="WindowManager.toggleMaximize('${appId}')" title="Maximize / Restore" class="w-6 h-6 rounded-md bg-slate-800 hover:bg-slate-700 text-slate-300 flex items-center justify-center text-[11px] transition">&#x25A1;</button>
              <button type="button" onclick="WindowManager.closeWindow('${appId}')" title="Close" class="w-6 h-6 rounded-md bg-red-500/15 hover:bg-red-500 text-red-300 hover:text-white flex items-center justify-center text-xs transition">&times;</button>
            </div>
          </div>
          <div id="win-body-${appId}" class="os-window-body"></div>
          <div class="resize-handle" title="Drag to resize"></div>
        `;

        // Focus on click anywhere inside window
        winEl.addEventListener('pointerdown', () => this.focusWindow(appId));

        // Double-click titlebar to maximize
        const titlebar = winEl.querySelector('.win-titlebar');
        titlebar.addEventListener('dblclick', (e) => {
          if (e.target.closest('button')) return;
          this.toggleMaximize(appId);
        });

        // Dragging logic (Mouse & Touch via Pointer Events)
        titlebar.addEventListener('pointerdown', (e) => {
          if (e.target.closest('button')) return;
          const state = this.windows[appId];
          if (!state || state.maximized) return;
          e.preventDefault();
          const startX = e.clientX;
          const startY = e.clientY;
          const origLeft = winEl.offsetLeft;
          const origTop = winEl.offsetTop;

          const onMove = (ev) => {
            const dx = ev.clientX - startX;
            const dy = ev.clientY - startY;
            const maxLeft = window.innerWidth - 90;
            const maxTop = window.innerHeight - 92;
            winEl.style.left = `${Math.max(-winEl.offsetWidth + 90, Math.min(maxLeft, origLeft + dx))}px`;
            winEl.style.top = `${Math.max(0, Math.min(maxTop, origTop + dy))}px`;
          };
          const onUp = () => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
          };
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });

        // Resizing logic
        const resizeHandle = winEl.querySelector('.resize-handle');
        resizeHandle.addEventListener('pointerdown', (e) => {
          const state = this.windows[appId];
          if (!state || state.maximized) return;
          e.preventDefault();
          e.stopPropagation();
          const startX = e.clientX;
          const startY = e.clientY;
          const origW = winEl.offsetWidth;
          const origH = winEl.offsetHeight;

          const onMove = (ev) => {
            const newW = Math.max(320, Math.min(window.innerWidth - winEl.offsetLeft, origW + (ev.clientX - startX)));
            const newH = Math.max(250, Math.min(window.innerHeight - 52 - winEl.offsetTop, origH + (ev.clientY - startY)));
            winEl.style.width = `${newW}px`;
            winEl.style.height = `${newH}px`;
          };
          const onUp = () => {
            window.removeEventListener('pointermove', onMove);
            window.removeEventListener('pointerup', onUp);
          };
          window.addEventListener('pointermove', onMove);
          window.addEventListener('pointerup', onUp);
        });

        document.getElementById('windows-layer').appendChild(winEl);
        this.windows[appId] = { id: appId, el: winEl, pid, minimized: false, maximized: false };
        this.focusWindow(appId);
        this.renderTaskbar();

        // Mount App UI inside window body
        AppModules[appId].mount(document.getElementById(`win-body-${appId}`));
      },

      focusWindow(appId) {
        const w = this.windows[appId];
        if (!w) return;
        this.zCounter += 1;
        w.el.style.zIndex = this.zCounter;
        this.focusedId = appId;
        Object.values(this.windows).forEach(win => {
          win.el.classList.toggle('focused', win.id === appId);
        });
        this.renderTaskbar();
      },

      minimizeWindow(appId) {
        const w = this.windows[appId];
        if (!w) return;
        w.minimized = true;
        w.el.classList.add('hidden');
        if (this.focusedId === appId) this.focusedId = null;
        this.renderTaskbar();
      },

      toggleMaximize(appId) {
        const w = this.windows[appId];
        if (!w) return;
        w.maximized = !w.maximized;
        w.el.classList.toggle('maximized', w.maximized);
        this.focusWindow(appId);
      },

      closeWindow(appId) {
        const w = this.windows[appId];
        if (!w) return;
        w.el.remove();
        delete this.windows[appId];
        if (this.focusedId === appId) this.focusedId = null;
        this.renderTaskbar();
      },

      toggleFromTaskbar(appId) {
        const w = this.windows[appId];
        if (!w) return;
        if (w.minimized) {
          w.minimized = false;
          w.el.classList.remove('hidden');
          this.focusWindow(appId);
        } else if (this.focusedId === appId) {
          this.minimizeWindow(appId);
        } else {
          this.focusWindow(appId);
        }
      },

      cascadeWindows() {
        let i = 0;
        Object.values(this.windows).forEach(w => {
          w.minimized = false;
          w.maximized = false;
          w.el.classList.remove('hidden', 'maximized');
          w.el.style.left = `${Math.min(window.innerWidth - 360, 180 + i * 32)}px`;
          w.el.style.top = `${Math.min(window.innerHeight - 320, 20 + i * 30)}px`;
          this.focusWindow(w.id);
          i++;
        });
      },

      renderTaskbar() {
        const container = document.getElementById('taskbar-windows');
        if (!container) return;
        const wins = Object.values(this.windows);
        if (wins.length === 0) {
          container.innerHTML = `<span class="text-[11px] font-mono text-slate-500 px-2">No open windows — click any icon to launch</span>`;
          return;
        }
        container.innerHTML = wins.map(w => {
          const app = APP_REGISTRY[w.id];
          const isFocused = this.focusedId === w.id && !w.minimized;
          return `
            <button onclick="WindowManager.toggleFromTaskbar('${w.id}')"
              class="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg text-xs font-medium border transition max-w-[165px] ${
                isFocused
                  ? 'bg-cobalt/25 border-cobaltbright/70 text-white shadow-sm'
                  : w.minimized
                    ? 'bg-slate-900/70 border-slate-800 text-slate-400 hover:bg-slate-800'
                    : 'bg-slate-800/80 border-slate-700 text-slate-200 hover:bg-slate-700'
              }">
              <span class="${app.color} scale-75 shrink-0">${app.icon}</span>
              <span class="truncate">${escapeHtml(app.short)}</span>
              ${w.minimized ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-400 shrink-0"></span>' : ''}
            </button>
          `;
        }).join('');
      }
    };

    /* =======================================================================
     * DESKTOP SHELL UI (Icons, Start Menu, Tray, Clock)
     * ======================================================================= */
    const DesktopUI = {
      initialized: false,

      enterDesktop() {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('desktop-env').classList.remove('hidden');

        // Update tray user badge
        const u = Kernel.currentUser;
        document.getElementById('tray-username').textContent = u.username;
        document.getElementById('start-menu-user').textContent = `${u.username} (uid:${u.uid})`;
        const dot = document.getElementById('tray-user-dot');
        dot.className = `w-2 h-2 rounded-full ${u.uid === 0 ? 'bg-amber-400' : 'bg-acid'}`;

        if (!this.initialized) {
          this.renderDesktopIcons();
          this.renderStartMenu();
          this.startClock();
          this.initialized = true;
          // Auto-launch Shell Terminal for instant interactivity
          WindowManager.openApp('terminal');
        } else {
          // Refresh open windows for new user context
          Object.keys(WindowManager.windows).forEach(id => {
            if (AppModules[id] && AppModules[id].refresh) AppModules[id].refresh();
          });
        }

        showToast('NovaOS 2026 Mounted', `Signed in as ${u.username} (${u.role})`, 'success');
      },

      renderDesktopIcons() {
        const container = document.getElementById('desktop-icons');
        container.innerHTML = Object.values(APP_REGISTRY).map(app => `
          <button onclick="WindowManager.openApp('${app.id}')"
            class="group w-[90px] sm:w-[94px] p-2.5 rounded-xl flex flex-col items-center gap-1.5 text-center bg-slate-900/45 hover:bg-slate-800/80 border border-transparent hover:border-cobaltbright/40 transition backdrop-blur-sm">
            <div class="w-11 h-11 rounded-xl border ${app.bg} ${app.color} flex items-center justify-center shadow-lg group-hover:scale-105 transition">
              ${app.icon}
            </div>
            <span class="text-[11px] font-medium text-slate-200 leading-tight line-clamp-2 drop-shadow">${escapeHtml(app.short)}</span>
            <span class="text-[9px] font-mono text-slate-500 group-hover:text-slate-300">${escapeHtml(app.tag)}</span>
          </button>
        `).join('');
      },

      renderStartMenu() {
        const list = document.getElementById('start-menu-list');
        list.innerHTML = Object.values(APP_REGISTRY).map(app => `
          <button onclick="WindowManager.openApp('${app.id}')"
            class="w-full flex items-center gap-3 p-2 rounded-lg hover:bg-slate-800/90 text-left transition group">
            <div class="w-9 h-9 rounded-lg border shrink-0 ${app.bg} ${app.color} flex items-center justify-center">
              ${app.icon}
            </div>
            <div class="min-w-0 flex-1">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-semibold text-slate-100 group-hover:text-white truncate">${escapeHtml(app.title)}</span>
                <span class="text-[10px] font-mono text-slate-500 shrink-0">${escapeHtml(app.tag)}</span>
              </div>
              <div class="text-[11px] text-slate-400 truncate">${escapeHtml(app.desc)}</div>
            </div>
          </button>
        `).join('');
      },

      toggleStartMenu(forceState) {
        const menu = document.getElementById('start-menu');
        const show = forceState !== undefined ? forceState : menu.classList.contains('hidden');
        menu.classList.toggle('hidden', !show);
      },

      startClock() {
        const update = () => {
          const el = document.getElementById('tray-clock');
          if (el) el.textContent = nowTimeStr();
        };
        update();
        setInterval(update, 1000);
      }
    };

    // Close Start Menu when clicking outside
    document.addEventListener('pointerdown', (e) => {
      const menu = document.getElementById('start-menu');
      const btn = document.getElementById('start-btn');
      if (menu && !menu.classList.contains('hidden') && !menu.contains(e.target) && !btn.contains(e.target)) {
        menu.classList.add('hidden');
      }
    });

    /* =======================================================================
     * ALL 9 INTERACTIVE DESKTOP APPLICATIONS
     * ======================================================================= */
    const AppModules = {};

    /* -----------------------------------------------------------------------
     * APP #1: INTERACTIVE SHELL TERMINAL (Pipes, Redirection, History, Syscalls)
     * ----------------------------------------------------------------------- */
    AppModules.terminal = {
      history: [],
      histIdx: -1,
      lines: [
        { type: 'banner', text: 'NovaOS 2026 Interactive Shell (bash-compat) — Project #1' },
        { type: 'muted', text: 'Type `help` for available commands. Supports `>` redirection and `| grep`, `| upper`, `| wc` pipes.' },
      ],

      mount(container) {
        this.container = container;
        this.render();
      },

      refresh() {
        if (this.container) this.render();
      },

      promptText() {
        const u = Kernel.currentUser ? Kernel.currentUser.username : 'guest';
        return `${u}@novaos:~$`;
      },

      render() {
        const c = this.container;
        if (!c) return;
        c.innerHTML = `
          <div class="h-full flex flex-col bg-[#070b14] font-mono text-xs p-3" onclick="document.getElementById('term-cmd-input')?.focus()">
            <div id="term-output" class="flex-1 overflow-y-auto space-y-1 pr-1 pb-2">
              ${this.lines.map(l => {
                if (l.type === 'cmd') return `<div class="text-slate-100"><span class="text-acid font-semibold">${escapeHtml(l.prompt)}</span> ${escapeHtml(l.text)}</div>`;
                if (l.type === 'err') return `<div class="text-red-400 whitespace-pre-wrap break-words">${escapeHtml(l.text)}</div>`;
                if (l.type === 'ok') return `<div class="text-lime-300 whitespace-pre-wrap break-words">${escapeHtml(l.text)}</div>`;
                if (l.type === 'banner') return `<div class="text-cobaltbright font-bold">${escapeHtml(l.text)}</div>`;
                if (l.type === 'muted') return `<div class="text-slate-400 whitespace-pre-wrap break-words">${escapeHtml(l.text)}</div>`;
                return `<div class="text-slate-200 whitespace-pre-wrap break-words">${escapeHtml(l.text)}</div>`;
              }).join('')}
            </div>
            <div class="pt-2 border-t border-slate-800/90 flex items-center gap-2 shrink-0">
              <span class="text-acid font-semibold shrink-0">${escapeHtml(this.promptText())}</span>
              <input id="term-cmd-input" type="text" autocomplete="off" spellcheck="false" placeholder="Enter command (e.g. ls -l, cat readme.txt | grep FAT)..."
                class="term-input text-xs" />
            </div>
          </div>
        `;
        const out = c.querySelector('#term-output');
        out.scrollTop = out.scrollHeight;

        const input = c.querySelector('#term-cmd-input');
        input.focus();
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const val = input.value;
            input.value = '';
            this.execLine(val);
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            if (this.history.length > 0) {
              if (this.histIdx < this.history.length - 1) this.histIdx++;
              input.value = this.history[this.history.length - 1 - this.histIdx] || '';
            }
          } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (this.histIdx > 0) {
              this.histIdx--;
              input.value = this.history[this.history.length - 1 - this.histIdx] || '';
            } else {
              this.histIdx = -1;
              input.value = '';
            }
          }
        });
      },

      pushLine(text, type = 'out') {
        this.lines.push({ text, type });
        if (this.lines.length > 250) this.lines.shift();
      },

      execLine(raw) {
        const cmdLine = raw.trim();
        this.lines.push({ type: 'cmd', prompt: this.promptText(), text: cmdLine });
        if (!cmdLine) {
          this.render();
          return;
        }
        this.history.push(cmdLine);
        this.histIdx = -1;

        // Parse output redirection (`>` or `>>`)
        let redirectFile = null;
        let appendMode = false;
        let mainPipeline = cmdLine;

        const redirIdx = cmdLine.indexOf('>');
        if (redirIdx !== -1) {
          appendMode = cmdLine[redirIdx + 1] === '>';
          mainPipeline = cmdLine.slice(0, redirIdx).trim();
          redirectFile = cmdLine.slice(redirIdx + (appendMode ? 2 : 1)).trim().split(/\s+/)[0];
        }

        // Split by pipe `|`
        const stages = mainPipeline.split('|').map(s => s.trim()).filter(Boolean);
        if (stages.length === 0) {
          this.render();
          return;
        }

        const firstRes = this.runSingleCommand(stages[0]);
        if (firstRes.clear) {
          this.lines = [];
          this.render();
          return;
        }
        if (firstRes.error) {
          this.pushLine(firstRes.error, 'err');
          this.render();
          return;
        }

        let output = firstRes.output || '';

        // Apply pipe filters
        for (let i = 1; i < stages.length; i++) {
          const parts = stages[i].split(/\s+/);
          const filter = parts[0].toLowerCase();
          if (filter === 'grep') {
            const pattern = parts.slice(1).join(' ');
            if (!pattern) {
              this.pushLine('grep: missing search pattern', 'err');
              this.render();
              return;
            }
            const re = new RegExp(pattern.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');
            output = output.split('\n').filter(line => re.test(line)).join('\n');
          } else if (filter === 'upper') {
            output = output.toUpperCase();
          } else if (filter === 'lower') {
            output = output.toLowerCase();
          } else if (filter === 'wc') {
            const lineCnt = output ? output.split('\n').length : 0;
            const wordCnt = output.trim() ? output.trim().split(/\s+/).length : 0;
            const charCnt = output.length;
            output = `  lines: ${lineCnt}  words: ${wordCnt}  bytes: ${charCnt}`;
          } else {
            this.pushLine(`pipe: unsupported filter '${filter}' (supported: grep, upper, lower, wc)`, 'err');
            this.render();
            return;
          }
        }

        // Handle redirection via SYS_WRITE
        if (redirectFile) {
          const wr = Kernel.syscall(SYSCALL.SYS_WRITE, { path: redirectFile, content: output, append: appendMode }, 101);
          if (wr.errno !== 0) {
            this.pushLine(`sh: ${redirectFile}: ${wr.status} (${wr.message})`, 'err');
          } else {
            this.pushLine(`[SYS_WRITE OK] Redirected ${output.length}B -> ${redirectFile}`, 'ok');
          }
        } else if (output !== '') {
          this.pushLine(output, firstRes.style || 'out');
        }

        this.render();
      },

      runSingleCommand(stage) {
        const tokens = stage.match(/(?:[^\s"]+|"[^"]*")+/g) || [];
        const args = tokens.map(t => t.replace(/^"|"$/g, ''));
        const cmd = (args[0] || '').toLowerCase();
        const rest = args.slice(1);

        switch (cmd) {
          case 'help':
            return {
              output: [
                'NovaOS 2026 Shell Commands:',
                '  help                    Show this help table',
                '  clear                   Clear terminal buffer',
                '  whoami | date | uname   Current user, system time, kernel version',
                '  ls [-l]                 List files in FAT-128 directory',
                '  cat <file|/dev/dev>     Read file or device via SYS_READ',
                '  touch <file>            Create empty file via SYS_OPEN',
                '  echo <text> [> file]    Print text or redirect to file',
                '  write <file> <text>     Write text into file/device via SYS_WRITE',
                '  rm <file>               Delete file via SYS_UNLINK',
                '  chmod <octal> <file>    Change permissions (e.g. chmod 644 notes.txt)',
                '  ps                      List running kernel & GUI processes',
                '  lsmod                   List Loadable Kernel Modules (LKMs)',
                '  insmod <dev>            Load character driver (vchar0 / vrand0)',
                '  rmmod <dev>             Unload character driver',
                '  dmesg                   Show recent kernel ring buffer messages',
                '  audit                   Show recent security audit log entries',
                '  syscalls                Show recent system call trap records',
                '  logout                  Lock session and return to Login screen',
                'Pipes: `| grep <word>`, `| upper`, `| lower`, `| wc`   Redirection: `> file`, `>> file`',
              ].join('\n'),
              style: 'muted',
            };

          case 'clear':
            return { clear: true };

          case 'whoami':
            return { output: `${Kernel.currentUser.username} (uid=${Kernel.currentUser.uid}, gid=${Kernel.currentUser.gid}, role=${Kernel.currentUser.role})` };

          case 'date':
            return { output: new Date().toString() };

          case 'uname':
            return { output: Kernel.version };

          case 'ls': {
            const longFmt = rest.includes('-l') || rest.includes('-la');
            const files = Object.values(Kernel.fs.directory).sort((a, b) => a.name.localeCompare(b.name));
            if (files.length === 0) return { output: '(empty directory)' };
            if (!longFmt) {
              return { output: files.map(f => f.name).join('   ') };
            }
            const header = 'MODE        OCT  OWNER     SIZE   BLK  NAME';
            const rows = files.map(f => {
              const chain = Kernel._fsGetChain(f.startBlock);
              return `-${modeToRwx(f.mode)}  ${modeToOctalString(f.mode)}  ${f.owner.padEnd(8)}  ${String(f.size + 'B').padStart(5)}  ${String(chain.length).padStart(3)}  ${f.name}`;
            });
            return { output: [header, ...rows].join('\n') };
          }

          case 'cat': {
            if (!rest[0]) return { error: 'Usage: cat <filename|/dev/vchar0>' };
            const res = Kernel.syscall(SYSCALL.SYS_READ, { path: rest[0] }, 101);
            if (res.errno !== 0) return { error: `cat: ${rest[0]}: ${res.status} — ${res.message}` };
            return { output: res.data };
          }

          case 'touch': {
            if (!rest[0]) return { error: 'Usage: touch <filename>' };
            const res = Kernel.syscall(SYSCALL.SYS_OPEN, { path: rest[0], create: true }, 101);
            if (res.errno !== 0) return { error: `touch: ${res.status} — ${res.message}` };
            return { output: res.message, style: 'ok' };
          }

          case 'echo':
            return { output: rest.join(' ') };

          case 'write': {
            if (rest.length < 2) return { error: 'Usage: write <filename|/dev/vchar0> <text>' };
            const path = rest[0];
            const text = rest.slice(1).join(' ');
            const res = Kernel.syscall(SYSCALL.SYS_WRITE, { path, content: text }, 101);
            if (res.errno !== 0) return { error: `write: ${res.status} — ${res.message}` };
            return { output: `[SYS_WRITE OK] ${res.message}`, style: 'ok' };
          }

          case 'rm': {
            if (!rest[0]) return { error: 'Usage: rm <filename>' };
            const res = Kernel.syscall(SYSCALL.SYS_UNLINK, { path: rest[0] }, 101);
            if (res.errno !== 0) return { error: `rm: ${res.status} — ${res.message}` };
            return { output: `[SYS_UNLINK OK] ${res.message}`, style: 'ok' };
          }

          case 'chmod': {
            if (rest.length < 2) return { error: 'Usage: chmod <octal> <filename> (e.g. chmod 644 notes.txt)' };
            const res = Kernel.syscall(SYSCALL.SYS_CHMOD, { mode: rest[0], path: rest[1] }, 101);
            if (res.errno !== 0) return { error: `chmod: ${res.status} — ${res.message}` };
            return { output: `[SYS_CHMOD OK] ${res.message}`, style: 'ok' };
          }

          case 'ps': {
            const hdr = 'PID   USER      STATE     CPU%  MEM    COMMAND';
            const rows = Kernel.processes.map(p =>
              `${String(p.pid).padEnd(5)} ${p.user.padEnd(9)} ${p.state.padEnd(9)} ${String(p.cpu).padStart(4)}  ${p.mem.padEnd(6)} ${p.name}`
            );
            return { output: [hdr, ...rows].join('\n') };
          }

          case 'lsmod': {
            const hdr = 'MODULE    DEV_PATH     MAJ:MIN  STATUS    OPEN_FDS';
            const rows = Object.values(Kernel.modules).map(m =>
              `${m.name.padEnd(9)} ${m.devPath.padEnd(12)} ${String(m.major + ':' + m.minor).padEnd(8)} ${(m.loaded ? 'LOADED' : 'UNLOADED').padEnd(9)} ${m.openFds.length}`
            );
            return { output: [hdr, ...rows].join('\n') };
          }

          case 'insmod': {
            if (!rest[0]) return { error: 'Usage: insmod <vchar0|vrand0>' };
            const res = Kernel.syscall(SYSCALL.SYS_INSMOD, { module: rest[0], action: 'load' }, 101);
            if (res.errno !== 0) return { error: `insmod: ${res.status} — ${res.message}` };
            return { output: `[SYS_INSMOD OK] ${res.message}`, style: 'ok' };
          }

          case 'rmmod': {
            if (!rest[0]) return { error: 'Usage: rmmod <vchar0|vrand0>' };
            const res = Kernel.syscall(SYSCALL.SYS_INSMOD, { module: rest[0], action: 'unload' }, 101);
            if (res.errno !== 0) return { error: `rmmod: ${res.status} — ${res.message}` };
            return { output: `[SYS_INSMOD OK] ${res.message}`, style: 'ok' };
          }

          case 'dmesg': {
            return {
              output: Kernel.dmesg.slice(0, 14).reverse().map(d => `[${d.uptime}] ${d.level.padEnd(5)} ${d.msg}`).join('\n')
            };
          }

          case 'audit': {
            return {
              output: Kernel.auditLog.slice(0, 12).map(a => `[${a.time}] ${a.eventType.padEnd(15)} ${a.user.padEnd(8)} ${a.detail}`).join('\n')
            };
          }

          case 'syscalls': {
            return {
              output: Kernel.syscallLog.slice(0, 12).map(s => `#${String(s.id).padEnd(4)} ${s.time} ${s.name.padEnd(11)} ${s.status.padEnd(7)} ${s.argsSummary}`).join('\n')
            };
          }

          case 'logout':
            setTimeout(() => Kernel.logout(), 100);
            return { output: 'Logging out...', style: 'muted' };

          default:
            return { error: `novaos-sh: command not found: ${cmd}. Type 'help' for commands.` };
        }
      }
    };

    /* -----------------------------------------------------------------------
     * APP #2: FAT-128 FILE SYSTEM EXPLORER & BLOCK ALLOCATION GRID
     * ----------------------------------------------------------------------- */
    AppModules.files = {
      selectedFile: 'readme.txt',
      selectedBlock: null,
      statusMsg: null,

      mount(container) {
        this.container = container;
        this.render();
      },

      refresh() {
        if (this.container) this.render();
      },

      selectFile(name) {
        this.selectedFile = name;
        this.selectedBlock = null;
        this.statusMsg = null;
        this.render();
      },

      createNewFile() {
        const inp = document.getElementById('fs-new-filename');
        const name = (inp ? inp.value : '').trim();
        if (!name) {
          this.statusMsg = { type: 'err', text: 'Enter a valid filename first.' };
          this.render();
          return;
        }
        const res = Kernel.syscall(SYSCALL.SYS_WRITE, { path: name, content: `// Created by ${Kernel.currentUser.username} on ${nowTimestamp()}\n`, mode: 0o644 }, 102);
        if (res.errno !== 0) {
          this.statusMsg = { type: 'err', text: `${res.status}: ${res.message}` };
        } else {
          this.selectedFile = name;
          this.statusMsg = { type: 'ok', text: `Created ${name} (${res.message})` };
          showToast('File Created', `${name} allocated on FAT-128`, 'success');
        }
        this.render();
      },

      saveSelectedFile() {
        if (!this.selectedFile) return;
        const editor = document.getElementById('fs-file-editor');
        const content = editor ? editor.value : '';
        const res = Kernel.syscall(SYSCALL.SYS_WRITE, { path: this.selectedFile, content }, 102);
        if (res.errno !== 0) {
          this.statusMsg = { type: 'err', text: `${res.status}: ${res.message}` };
          showToast('Write Denied', res.message, 'error');
        } else {
          this.statusMsg = { type: 'ok', text: `Saved ${this.selectedFile}: ${res.message}` };
          showToast('File Saved', res.message, 'success');
        }
        this.render();
      },

      deleteSelectedFile() {
        if (!this.selectedFile) return;
        const target = this.selectedFile;
        const res = Kernel.syscall(SYSCALL.SYS_UNLINK, { path: target }, 102);
        if (res.errno !== 0) {
          this.statusMsg = { type: 'err', text: `${res.status}: ${res.message}` };
          showToast('Delete Denied', res.message, 'error');
        } else {
          const remaining = Object.keys(Kernel.fs.directory);
          this.selectedFile = remaining[0] || null;
          this.statusMsg = { type: 'ok', text: `Deleted ${target} & freed blocks.` };
          showToast('File Deleted', `${target} removed from FAT-128`, 'warn');
        }
        this.render();
      },

      applyChmod(octalVal) {
        if (!this.selectedFile) return;
        const mode = octalVal || (document.getElementById('fs-chmod-input')?.value || '').trim();
        const res = Kernel.syscall(SYSCALL.SYS_CHMOD, { path: this.selectedFile, mode }, 102);
        if (res.errno !== 0) {
          this.statusMsg = { type: 'err', text: `${res.status}: ${res.message}` };
          showToast('chmod Denied', res.message, 'error');
        } else {
          this.statusMsg = { type: 'ok', text: `Permissions updated: ${res.message}` };
        }
        this.render();
      },

      render() {
        const c = this.container;
        if (!c) return;

        const files = Object.values(Kernel.fs.directory).sort((a, b) => a.name.localeCompare(b.name));
        if (this.selectedFile && !Kernel.fs.directory[this.selectedFile]) {
          this.selectedFile = files[0] ? files[0].name : null;
        }

        const entry = this.selectedFile ? Kernel.fs.directory[this.selectedFile] : null;
        const selectedChain = entry ? Kernel._fsGetChain(entry.startBlock) : [];
        const selectedChainSet = new Set(selectedChain);

        // Read file content through permission check
        let fileContent = '';
        let readDenied = false;
        if (entry) {
          if (Kernel.checkPermission(entry, Kernel.currentUser, 4)) {
            fileContent = Kernel._fsReadInternal(entry.name);
          } else {
            readDenied = true;
          }
        }

        // Disk usage stats
        let usedBlocks = 0;
        for (let i = 0; i < Kernel.fs.NUM_BLOCKS; i++) {
          if (Kernel.fs.fat[i] !== -1) usedBlocks++;
        }

        c.innerHTML = `
          <div class="h-full flex flex-col lg:flex-row divide-y lg:divide-y-0 lg:divide-x divide-slate-800">
            <!-- Left Directory Table -->
            <div class="w-full lg:w-72 shrink-0 flex flex-col bg-[#0b1120]">
              <div class="p-3 border-b border-slate-800">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-xs font-bold uppercase tracking-wider text-slate-300">FAT-128 Directory</span>
                  <span class="text-[11px] font-mono text-cobaltbright">${usedBlocks}/128 blks</span>
                </div>
                <div class="w-full h-1.5 rounded-full bg-slate-800 overflow-hidden mb-3">
                  <div class="h-full bg-gradient-to-r from-cobalt to-acid transition-all" style="width:${(usedBlocks / 128) * 100}%"></div>
                </div>
                <div class="flex gap-1.5">
                  <input id="fs-new-filename" type="text" placeholder="newfile.txt" class="flex-1 min-w-0 px-2.5 py-1.5 rounded-lg bg-[#090d16] border border-slate-700 text-xs font-mono text-white outline-none focus:border-cobaltbright" />
                  <button onclick="AppModules.files.createNewFile()" class="px-2.5 py-1.5 rounded-lg bg-cobalt hover:bg-cobaltbright text-white text-xs font-semibold transition shrink-0">+ New</button>
                </div>
              </div>
              <div class="flex-1 overflow-y-auto p-2 space-y-1">
                ${files.map(f => {
                  const active = f.name === this.selectedFile;

                  return `
                    <button onclick="AppModules.files.selectFile('${escapeHtml(f.name)}')"
                      class="w-full p-2.5 rounded-lg border text-left transition ${
                        active ? 'bg-cobalt/20 border-cobaltbright/60 text-white' : 'bg-slate-900/50 border-slate-800/80 hover:bg-slate-800/70 text-slate-300'
                      }">
                      <div class="flex items-center justify-between gap-2">
                        <span class="text-xs font-mono font-semibold truncate">${escapeHtml(f.name)}</span>
                        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded ${canRead ? 'bg-slate-800 text-slate-300' : 'bg-red-500/20 text-red-300'}">${modeToOctalString(f.mode)}</span>
                      </div>
                      <div class="flex items-center justify-between mt-1 text-[10px] font-mono text-slate-400">
                        <span>${escapeHtml(f.owner)} &bull; ${modeToRwx(f.mode)}</span>
                        <span>${f.size}B &bull; B${f.startBlock}</span>
                      </div>
                    </button>

                }).join('')}
              </div>
            </div>

            <!-- Right Inspector + FAT Grid -->
            <div class="flex-1 min-w-0 flex flex-col overflow-y-auto p-3.5 space-y-3.5">
              ${this.statusMsg ? `
                <div class="px-3 py-2 rounded-lg text-xs font-mono border ${
                  this.statusMsg.type === 'err' ? 'bg-red-950/50 border-red-500/50 text-red-300' : 'bg-lime-950/40 border-acid/50 text-lime-300'
                }">${escapeHtml(this.statusMsg.text)}</div>
              ` : ''}

              ${entry ? `
                <!-- File Inspector & Editor -->
                <div class="rounded-xl bg-slatepanel border border-slate-800 p-3.5 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <div>
                      <div class="flex items-center gap-2">
                        <h3 class="text-sm font-mono font-bold text-white">${escapeHtml(entry.name)}</h3>
                        <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-slate-800 text-acid border border-slate-700">-${modeToRwx(entry.mode)} (${modeToOctalString(entry.mode)})</span>
                      </div>
                      <div class="text-[11px] font-mono text-slate-400 mt-0.5">
                        Owner: <span class="text-slate-200">${escapeHtml(entry.owner)}</span> &bull;
                        Size: <span class="text-slate-200">${entry.size} bytes</span> &bull;
                        Chain: <span class="text-cobaltbright">${selectedChain.map(b => 'B' + b).join(' &rarr; ')} [EOF]</span>
                      </div>
                    </div>
                    <div class="flex flex-wrap items-center gap-1.5">
                      <input id="fs-chmod-input" type="text" value="${modeToOctalString(entry.mode)}" maxlength="3" class="w-14 px-2 py-1 rounded-lg bg-[#090d16] border border-slate-700 text-xs font-mono text-center text-white" />
                      <button onclick="AppModules.files.applyChmod()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-mono text-amber-300 transition">chmod</button>
                      <button onclick="AppModules.files.applyChmod('644')" class="px-2 py-1 rounded-lg bg-slate-800/70 hover:bg-slate-700 text-[10px] font-mono text-slate-300">644</button>
                      <button onclick="AppModules.files.applyChmod('600')" class="px-2 py-1 rounded-lg bg-slate-800/70 hover:bg-slate-700 text-[10px] font-mono text-slate-300">600</button>
                      <button onclick="AppModules.files.deleteSelectedFile()" class="px-2.5 py-1 rounded-lg bg-red-500/15 hover:bg-red-500/30 border border-red-500/40 text-xs font-mono text-red-300 transition">Delete</button>
                    </div>
                  </div>

                  ${readDenied ? `
                    <div class="p-4 rounded-lg bg-red-950/40 border border-red-500/40 text-xs font-mono text-red-300 flex items-center justify-between">
                      <span>EACCES (-13): Permission denied reading '${escapeHtml(entry.name)}'. Owned by '${escapeHtml(entry.owner)}' (mode ${modeToOctalString(entry.mode)}). Sign in as root to inspect.</span>
                    </div>
                  ` : `
                    <textarea id="fs-file-editor" rows="5" class="w-full p-3 rounded-lg bg-[#090d16] border border-slate-700 focus:border-cobaltbright outline-none text-xs font-mono text-slate-100 leading-relaxed resize-y">${escapeHtml(fileContent)}</textarea>
                    <div class="flex items-center justify-between">
                      <span class="text-[11px] font-mono text-slate-500">512 bytes/block &bull; Saving routes through SYS_WRITE</span>
                      <button onclick="AppModules.files.saveSelectedFile()" class="px-3.5 py-1.5 rounded-lg bg-cobalt hover:bg-cobaltbright text-white text-xs font-semibold transition">Save Changes (SYS_WRITE)</button>
                    </div>
                  `}
                </div>
              ` : `<div class="p-6 text-center text-xs font-mono text-slate-500">Select or create a file.</div>`}

              <!-- 128-Block FAT Grid Visualizer -->
              <div class="rounded-xl bg-slatepanel border border-slate-800 p-3.5 space-y-2.5">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <h4 class="text-xs font-bold uppercase tracking-wider text-slate-200">FAT-128 Block Allocation Grid (512B/Block)</h4>
                    <p class="text-[11px] font-mono text-slate-400">Click any block to inspect its FAT pointer (-1 free, -2 EOF, &ge;0 next)</p>
                  </div>
                  <div class="flex flex-wrap items-center gap-3 text-[10px] font-mono">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-slate-800 border border-slate-700"></span>Free (-1)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-cobalt/70"></span>Used</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-acid/80"></span>EOF (-2)</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded bg-amber-400 ring-2 ring-amber-300/60"></span>Selected File</span>
                  </div>
                </div>

                <div class="grid grid-cols-8 sm:grid-cols-16 gap-1">
                  ${Array.from({ length: 128 }, (_, i) => {
                    const val = Kernel.fs.fat[i];
                    const isSelectedChain = selectedChainSet.has(i);
                    let cls = 'bg-slate-900 border-slate-800 text-slate-600 hover:border-slate-600';
                    if (isSelectedChain && val === -2) cls = 'bg-acid text-slate-950 font-bold border-white ring-1 ring-acid';
                    else if (isSelectedChain) cls = 'bg-amber-400 text-slate-950 font-bold border-amber-200 ring-1 ring-amber-400';
                    else if (val === -2) cls = 'bg-acid/25 border-acid/60 text-lime-300';
                    else if (val >= 0) cls = 'bg-cobalt/35 border-cobaltbright/60 text-blue-200';
                    return `
                      <button onclick="AppModules.files.selectedBlock=${i}; AppModules.files.render();"
                        title="Block ${i} | FAT[${i}] = ${val}"
                        class="h-7 rounded text-[10px] font-mono border flex items-center justify-center transition ${cls}">
                        ${i}
                      </button>
                    `;
                  }).join('')}
                </div>

                ${this.selectedBlock !== null ? `
                  <div class="p-2.5 rounded-lg bg-[#090d16] border border-slate-800 text-[11px] font-mono flex flex-wrap items-center justify-between gap-2">
                    <span><strong class="text-cobaltbright">Block #${this.selectedBlock}</strong> &bull; FAT[${this.selectedBlock}] = <span class="text-acid">${Kernel.fs.fat[this.selectedBlock]}</span> (${Kernel.fs.fat[this.selectedBlock] === -1 ? 'FREE' : Kernel.fs.fat[this.selectedBlock] === -2 ? 'EOF' : 'NEXT -> B' + Kernel.fs.fat[this.selectedBlock]})</span>
                    <span class="text-slate-400 truncate max-w-md">Data: "${escapeHtml((Kernel.fs.disk[this.selectedBlock] || '').slice(0, 60))}"</span>
                  </div>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }
    };

    /* -----------------------------------------------------------------------
     * APP #3: CPU PROCESS SCHEDULER SIMULATOR (FCFS, SJF, RR, Priority + Gantt)
     * ----------------------------------------------------------------------- */
    AppModules.scheduler = {
      algo: 'RR',
      quantum: 3,
      processes: [
        { pid: 1, arrival: 0, burst: 8, priority: 2 },
        { pid: 2, arrival: 1, burst: 4, priority: 1 },
        { pid: 3, arrival: 2, burst: 9, priority: 3 },
        { pid: 4, arrival: 3, burst: 5, priority: 2 },
      ],
      colors: ['#3b82f6', '#84cc16', '#f59e0b', '#ec4899', '#06b6d4', '#a855f7', '#ef4444', '#14b8a6'],

      mount(container) {
        this.container = container;
        this.render();
      },

      setPreset(name) {
        if (name === 'convoy') {
          this.processes = [
            { pid: 1, arrival: 0, burst: 16, priority: 3 },
            { pid: 2, arrival: 1, burst: 2, priority: 1 },
            { pid: 3, arrival: 2, burst: 3, priority: 2 },
            { pid: 4, arrival: 3, burst: 2, priority: 1 },
          ];
        } else if (name === 'balanced') {
          this.processes = [
            { pid: 1, arrival: 0, burst: 6, priority: 2 },
            { pid: 2, arrival: 2, burst: 4, priority: 1 },
            { pid: 3, arrival: 4, burst: 5, priority: 3 },
            { pid: 4, arrival: 5, burst: 3, priority: 2 },
          ];
        } else {
          const n = 5;
          this.processes = Array.from({ length: n }, (_, i) => ({
            pid: i + 1,
            arrival: Math.floor(Math.random() * 6),
            burst: Math.floor(Math.random() * 9) + 2,
            priority: Math.floor(Math.random() * 4) + 1,
          }));
        }
        this.render();
      },

      addProcess() {
        const nextId = this.processes.reduce((m, p) => Math.max(m, p.pid), 0) + 1;
        this.processes.push({ pid: nextId, arrival: 0, burst: 4, priority: 2 });
        this.render();
      },

      removeProcess(idx) {
        if (this.processes.length <= 1) return;
        this.processes.splice(idx, 1);
        this.render();
      },

      updateField(idx, field, val) {
        const num = Math.max(field === 'burst' || field === 'priority' ? 1 : 0, parseInt(val, 10) || 0);
        this.processes[idx][field] = Math.min(field === 'burst' ? 30 : 50, num);
        this.render();
      },

      simulate(algo, quantum) {
        const procs = this.processes.map(p => ({ ...p, remaining: p.burst, completion: 0, turnaround: 0, waiting: 0, response: -1 }));
        const gantt = [];
        let time = 0;
        let done = 0;
        const n = procs.length;

        if (algo === 'FCFS') {
          procs.sort((a, b) => a.arrival - b.arrival || a.pid - b.pid);
          for (const p of procs) {
            if (time < p.arrival) {
              gantt.push({ pid: 'IDLE', start: time, end: p.arrival });
              time = p.arrival;
            }
            p.response = time - p.arrival;
            gantt.push({ pid: p.pid, start: time, end: time + p.burst });
            time += p.burst;
            p.completion = time;
            p.turnaround = p.completion - p.arrival;
            p.waiting = p.turnaround - p.burst;
          }
        } else if (algo === 'SJF' || algo === 'PRIORITY') {
          const completed = new Set();
          while (done < n) {
            const avail = procs.filter(p => !completed.has(p.pid) && p.arrival <= time);
            if (avail.length === 0) {
              const nextArr = Math.min(...procs.filter(p => !completed.has(p.pid)).map(p => p.arrival));
              gantt.push({ pid: 'IDLE', start: time, end: nextArr });
              time = nextArr;
              continue;
            }
            if (algo === 'SJF') {
              avail.sort((a, b) => a.burst - b.burst || a.arrival - b.arrival || a.pid - b.pid);
            } else {
              avail.sort((a, b) => a.priority - b.priority || a.arrival - b.arrival || a.pid - b.pid);
            }
            const cur = avail[0];
            cur.response = time - cur.arrival;
            gantt.push({ pid: cur.pid, start: time, end: time + cur.burst });
            time += cur.burst;
            cur.completion = time;
            cur.turnaround = cur.completion - cur.arrival;
            cur.waiting = cur.turnaround - cur.burst;
            completed.add(cur.pid);
            done++;
          }
        } else if (algo === 'RR') {
          const sorted = [...procs].sort((a, b) => a.arrival - b.arrival || a.pid - b.pid);
          const queue = [];
          let nextIdx = 0;
          const q = Math.max(1, quantum);

          while (done < n) {
            while (nextIdx < n && sorted[nextIdx].arrival <= time) {
              queue.push(sorted[nextIdx++]);
            }
            if (queue.length === 0) {
              const jump = sorted[nextIdx].arrival;
              gantt.push({ pid: 'IDLE', start: time, end: jump });
              time = jump;
              continue;
            }
            const cur = queue.shift();
            if (cur.response === -1) cur.response = time - cur.arrival;
            const run = Math.min(q, cur.remaining);
            gantt.push({ pid: cur.pid, start: time, end: time + run });
            time += run;
            cur.remaining -= run;
            while (nextIdx < n && sorted[nextIdx].arrival <= time) {
              queue.push(sorted[nextIdx++]);
            }
            if (cur.remaining > 0) {
              queue.push(cur);
            } else {
              cur.completion = time;
              cur.turnaround = cur.completion - cur.arrival;
              cur.waiting = cur.turnaround - cur.burst;
              done++;
            }
          }
        }

        procs.sort((a, b) => a.pid - b.pid);
        const avgWait = procs.reduce((s, p) => s + p.waiting, 0) / n;
        const avgTat = procs.reduce((s, p) => s + p.turnaround, 0) / n;
        const avgResp = procs.reduce((s, p) => s + p.response, 0) / n;
        return { procs, gantt, totalTime: Math.max(1, time), avgWait, avgTat, avgResp };
      },

      render() {
        const c = this.container;
        if (!c) return;
        const res = this.simulate(this.algo, this.quantum);
        const allCompare = ['FCFS', 'SJF', 'RR', 'PRIORITY'].map(a => ({
          algo: a,
          ...this.simulate(a, this.quantum),
        }));
        const bestWait = Math.min(...allCompare.map(x => x.avgWait));

                        <span>${isIdle ? 'IDLE' : 'P' + seg.pid}</span>

                  }).join('')}
                </div>
              </div>
              <div class="grid grid-cols-3 gap-2 pt-1">
                <div class="p-2.5 rounded-lg bg-[#090d16] border border-slate-800 text-center">
                  <div class="text-[10px] font-mono text-slate-400 uppercase">Avg Waiting Time</div>
                  <div class="text-base font-mono font-bold text-cobaltbright">${res.avgWait.toFixed(2)} ms</div>
                </div>
                <div class="p-2.5 rounded-lg bg-[#090d16] border border-slate-800 text-center">
                  <div class="text-[10px] font-mono text-slate-400 uppercase">Avg Turnaround</div>

                <div class="p-2.5 rounded-lg bg-[#090d16] border border-slate-800 text-center">

            <!-- Process Table & Compare All Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
              <!-- Editable Process Input & Metrics -->
              <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-2.5">
                <div class="flex items-center justify-between">

                            <td class="py-1.5 text-center"><input type="number" min="1" value="${p.burst}" onchange="AppModules.scheduler.updateField(${idx},'burst',this.value)" class="w-12 bg-[#090d16] border border-slate-700 rounded px-1 py-0.5 text-center" /></td>
                            <td class="py-1.5 text-center"><input type="number" min="1" value="${p.priority}" onchange="AppModules.scheduler.updateField(${idx},'priority',this.value)" class="w-12 bg-[#090d16] border border-slate-700 rounded px-1 py-0.5 text-center" /></td>
                            <td class="py-1.5 text-right text-cobaltbright">${m ? m.waiting : 0}</td>
                            <td class="py-1.5 text-right text-acid">${m ? m.turnaround : 0}</td>
                            <td class="py-1.5 text-right"><button onclick="AppModules.scheduler.removeProcess(${idx})" class="text-slate-500 hover:text-red-400 px-1">&times;</button></td>
                          </tr>

              <!-- Compare All Algorithms -->
              <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-2.5">

    };

    /* -----------------------------------------------------------------------
     * APP #4: VIRTUAL MEMORY MANAGER (FIFO, LRU, Optimal Paging)
     * ----------------------------------------------------------------------- */
    AppModules.vmm = {
      algo: 'LRU',
      frames: 4,
      refInput: '7, 0, 1, 2, 0, 3, 0, 4, 2, 3, 0, 3, 2, 1, 2',
      inspectStep: null,

      mount(container) {
        this.container = container;
        this.render();
      },

      parseRef() {
        const nums = this.refInput.split(/[\s,]+/).map(s => parseInt(s, 10)).filter(n => !isNaN(n) && n >= 0 && n <= 31);
        return nums.length > 0 ? nums.slice(0, 28) : [7, 0, 1, 2, 0, 3];
      },

      setPreset(name) {
        if (name === 'belady') {
          this.refInput = '1, 2, 3, 4, 1, 2, 5, 1, 2, 3, 4, 5';
          this.frames = 3;
          this.algo = 'FIFO';
        } else if (name === 'locality') {
          this.refInput = '2, 3, 2, 1, 5, 2, 4, 5, 3, 2, 5, 2, 1, 2, 3';
          this.frames = 3;
        } else {
          this.refInput = Array.from({ length: 16 }, () => Math.floor(Math.random() * 8)).join(', ');
        }
        this.inspectStep = null;
        this.render();
      },

      simulate(algo, frameCount, refs) {
        const frames = Array(frameCount).fill(null);
        const fifoQueue = [];
        const lastUsed = new Map();
        const steps = [];
        let faults = 0;
        let hits = 0;

        refs.forEach((page, stepIdx) => {
          const hitIdx = frames.indexOf(page);
          let isHit = hitIdx !== -1;
          let changedFrame = hitIdx;

          if (isHit) {
            hits++;
            lastUsed.set(page, stepIdx);
          } else {
            faults++;
            const emptyIdx = frames.indexOf(null);
            if (emptyIdx !== -1) {
              frames[emptyIdx] = page;
              changedFrame = emptyIdx;
              fifoQueue.push(emptyIdx);
            } else if (algo === 'FIFO') {
              const victimIdx = fifoQueue.shift();
              frames[victimIdx] = page;
              changedFrame = victimIdx;
              fifoQueue.push(victimIdx);
            } else if (algo === 'LRU') {
              let lruIdx = 0;
              let minTime = Infinity;
              frames.forEach((p, idx) => {
                const t = lastUsed.has(p) ? lastUsed.get(p) : -1;
                if (t < minTime) { minTime = t; lruIdx = idx; }
              });
              frames[lruIdx] = page;
              changedFrame = lruIdx;
            } else if (algo === 'OPTIMAL') {
              let victimIdx = 0;
              let farthest = -1;
              frames.forEach((p, idx) => {
                const nextPos = refs.indexOf(p, stepIdx + 1);
                const dist = nextPos === -1 ? Infinity : nextPos;
                if (dist > farthest) { farthest = dist; victimIdx = idx; }
              });
              frames[victimIdx] = page;
              changedFrame = victimIdx;
            }
            lastUsed.set(page, stepIdx);
          }

          steps.push({
            step: stepIdx,
            page,
            isHit,
            changedFrame,
            frames: [...frames],
            lastUsedSnapshot: new Map(lastUsed),
          });
        });

        return {
          steps,
          faults,
          hits,
          total: refs.length,
          hitRate: (hits / refs.length) * 100,
          faultRate: (faults / refs.length) * 100,
        };
      },

      render() {
        const c = this.container;
        if (!c) return;
        const refs = this.parseRef();
        const activeRes = this.simulate(this.algo, this.frames, refs);
        const cmp = {
          FIFO: this.simulate('FIFO', this.frames, refs),
          LRU: this.simulate('LRU', this.frames, refs),
          OPTIMAL: this.simulate('OPTIMAL', this.frames, refs),
        };
        const curStepIdx = this.inspectStep !== null && this.inspectStep < activeRes.steps.length ? this.inspectStep : activeRes.steps.length - 1;
        const curStep = activeRes.steps[curStepIdx];
        const uniquePages = [...new Set(refs)].sort((a, b) => a - b);

        c.innerHTML = `
          <div class="p-4 space-y-4">

                    <input type="number" min="3" max="8" value="${this.frames}" onchange="AppModules.vmm.frames=Math.min(8,Math.max(3,parseInt(this.value)||4)); AppModules.vmm.render();"
                      class="w-10 bg-transparent text-acid font-bold text-center outline-none" />

                  <button onclick="AppModules.vmm.setPreset('random')" class="px-2.5 py-1 rounded-lg bg-cobalt/20 hover:bg-cobalt/30 border border-cobaltbright/40 text-[11px] font-mono text-blue-300">Randomize</button>
                </div>

              <div class="flex items-center gap-2">
                <span class="text-xs font-mono text-slate-400 shrink-0">Reference String:</span>
                <input id="vmm-ref-input" type="text" value="${escapeHtml(this.refInput)}"
                  onchange="AppModules.vmm.refInput=this.value; AppModules.vmm.inspectStep=null; AppModules.vmm.render();"
                  class="flex-1 px-3 py-1.5 rounded-lg bg-[#090d16] border border-slate-700 focus:border-cobaltbright outline-none text-xs font-mono text-white" />
                <button onclick="AppModules.vmm.refInput=document.getElementById('vmm-ref-input').value; AppModules.vmm.inspectStep=null; AppModules.vmm.render();"
                  class="px-3 py-1.5 rounded-lg bg-cobalt hover:bg-cobaltbright text-white text-xs font-semibold shrink-0">Run</button>
              </div>
            </div>

            <!-- Comparison Summary Cards -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              ${['FIFO', 'LRU', 'OPTIMAL'].map(a => {
                const r = cmp[a];
                const isActive = this.algo === a;
                return `
                  <div onclick="AppModules.vmm.algo='${a}'; AppModules.vmm.render();"
                    class="cursor-pointer p-3 rounded-xl border transition ${isActive ? 'bg-cobalt/15 border-cobaltbright' : 'bg-slatepanel border-slate-800 hover:border-slate-700'}">
                    <div class="flex items-center justify-between">
                      <span class="text-xs font-mono font-bold text-white">${a}</span>
                      <span class="text-[11px] font-mono text-red-400 font-bold">${r.faults} Faults</span>
                    </div>
                    <div class="flex items-center justify-between text-[11px] font-mono mt-1.5">
                      <span class="text-acid">Hit: ${r.hitRate.toFixed(1)}%</span>
                      <span class="text-red-300">Fault: ${r.faultRate.toFixed(1)}%</span>
                    </div>
                    <div class="w-full h-1.5 rounded-full bg-red-500/30 overflow-hidden mt-2">
                      <div class="h-full bg-acid" style="width:${r.hitRate}%"></div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <!-- Step-by-Step Frame Allocation Table -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-200">Frame Allocation Trace — ${this.algo} (Click column to inspect Page Table)</h4>
                <span class="text-[11px] font-mono text-slate-400">Hits: <strong class="text-acid">${activeRes.hits}</strong> | Faults: <strong class="text-red-400">${activeRes.faults}</strong></span>
              </div>
              <div class="overflow-x-auto pb-1">
                <table class="w-full text-xs font-mono border-collapse">
                  <thead>
                    <tr>
                      <th class="p-1.5 text-left text-slate-400 border-b border-slate-800 sticky left-0 bg-slatepanel">Ref</th>
                      ${activeRes.steps.map(s => `
                        <th onclick="AppModules.vmm.inspectStep=${s.step}; AppModules.vmm.render();"
                          class="p-1.5 text-center cursor-pointer border-b border-slate-800 transition ${s.step === curStepIdx ? 'bg-cobalt/30 text-white' : 'hover:bg-slate-800 text-slate-200'}">
                          P${s.page}
                        </th>
                      `).join('')}
                    </tr>
                  </thead>
                  <tbody>
                    ${Array.from({ length: this.frames }, (_, fIdx) => `
                      <tr>
                        <td class="p-1.5 text-slate-400 border-b border-slate-800/70 sticky left-0 bg-slatepanel">F${fIdx}</td>
                        ${activeRes.steps.map(s => {
                          const val = s.frames[fIdx];
                          const isChanged = s.changedFrame === fIdx;
                          const cellCls = isChanged
                            ? (s.isHit ? 'bg-acid/25 text-lime-300 font-bold' : 'bg-red-500/25 text-red-300 font-bold')

                          return `<td onclick="AppModules.vmm.inspectStep=${s.step}; AppModules.vmm.render();" class="p-1.5 text-center border border-slate-800/60 cursor-pointer ${cellCls}">${val !== null ? val : '-'}</td>`;
                        }).join('')}
                      </tr>
                    `).join('')}
                    <tr>
                      <td class="p-1.5 text-slate-400 sticky left-0 bg-slatepanel">Stat</td>
                      ${activeRes.steps.map(s => `
                        <td class="p-1.5 text-center text-[10px] font-bold ${s.isHit ? 'text-acid' : 'text-red-400'}">${s.isHit ? 'HIT' : 'FLT'}</td>
                      `).join('')}
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Page Table State at Selected Step -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-200">Page Table Snapshot at Step #${curStep.step + 1} (Access: Page ${curStep.page} — ${curStep.isHit ? 'HIT' : 'PAGE FAULT'})</h4>
              </div>
              <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-6 gap-2">
                ${uniquePages.map(pg => {

                  return `
                    <div class="p-2 rounded-lg border text-[11px] font-mono ${valid ? 'bg-lime-950/30 border-acid/40' : 'bg-[#090d16] border-slate-800'}">

    /* -----------------------------------------------------------------------
     * APP #6: SYSTEM CALL MONITOR & INTERACTIVE TRAP DISPATCHER
     * ----------------------------------------------------------------------- */
    AppModules.syscalls = {
      filter: 'ALL',
      testCode: 2,
      lastResult: null,

      mount(container) {
        this.container = container;
        this.render();
      },

      refresh() {
        if (this.container) this.render();
      },

      invokeTest() {
        const code = Number(document.getElementById('sys-test-code').value);
        const arg1 = (document.getElementById('sys-arg1')?.value || '').trim();
        const arg2 = (document.getElementById('sys-arg2')?.value || '').trim();
        let args = {};
        if (code === 1) args = { path: arg1 || 'readme.txt' };
        else if (code === 2) args = { path: arg1 || 'readme.txt' };
        else if (code === 3) args = { path: arg1 || 'test_trap.txt', content: arg2 || 'Written via SYS_WRITE trap' };
        else if (code === 4) args = { path: arg1 || 'test_trap.txt' };
        else if (code === 5) args = { path: arg1 || 'notes.txt', mode: arg2 || '644' };
        else if (code === 6) args = { name: arg1 || 'manual_worker' };
        else if (code === 7) args = { device: arg1 || 'vchar0', cmd: arg2 || 'IOCTL_UPPERCASE_MODE' };
        else if (code === 8) args = { op: arg1 || 'STATUS' };
        else if (code === 9) args = { action: arg1 || 'STATUS' };
        else if (code === 10) args = { module: arg1 || 'vchar0', action: arg2 || 'load' };

        this.testCode = code;
        this.lastResult = Kernel.syscall(code, args, 999);
        this.render();
      },

      placeholderHint(code) {
        const map = {
          1: ['path (e.g. readme.txt or /dev/vchar0)', '(unused)'],
          2: ['path (e.g. secret.key or /dev/vrand0)', '(unused)'],
          3: ['path (e.g. trap.txt)', 'content text'],
          4: ['filename to unlink', '(unused)'],
          5: ['filename (e.g. notes.txt)', 'octal mode (e.g. 600)'],
          6: ['process name (e.g. worker_d)', '(unused)'],
          7: ['device (vchar0 / vrand0)', 'cmd (IOCTL_UPPERCASE_MODE / IOCTL_FLUSH)'],
          8: ['op (STATUS / START_SERVER / STOP_SERVER)', '(unused)'],
          9: ['action (STATUS / UNLOCK_ALL)', '(unused)'],
          10: ['module (vchar0 / vrand0)', 'action (load / unload)'],
        };
        return map[code] || ['arg1', 'arg2'];
      },

      render() {
        const c = this.container;
        if (!c) return;
        const [p1, p2] = this.placeholderHint(this.testCode);
        const logs = Kernel.syscallLog.filter(s => {
          if (this.filter === 'OK') return s.errno === 0;
          if (this.filter === 'ERR') return s.errno !== 0;
          return true;
        });

        c.innerHTML = `
          <div class="p-4 space-y-4">
            <!-- Manual Syscall Trap Dispatcher -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-amber-400">Interactive Syscall Trap Dispatcher (int 0x80)</h3>
                <span class="text-[11px] font-mono text-slate-400">Total Traps: <strong class="text-acid">${Kernel.nextSyscallId - 1}</strong></span>
              </div>
              <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
                <select id="sys-test-code" onchange="AppModules.syscalls.testCode=Number(this.value); AppModules.syscalls.render();"
                  class="px-2.5 py-2 rounded-lg bg-[#090d16] border border-slate-700 text-xs font-mono text-white outline-none">
                  ${Object.entries(SYSCALL_NAMES).map(([k, v]) => `<option value="${k}" ${Number(k) === this.testCode ? 'selected' : ''}>${k}: ${v}</option>`).join('')}
                </select>
                <input id="sys-arg1" type="text" placeholder="${escapeHtml(p1)}" class="px-2.5 py-2 rounded-lg bg-[#090d16] border border-slate-700 text-xs font-mono text-white outline-none focus:border-cobaltbright" />
                <input id="sys-arg2" type="text" placeholder="${escapeHtml(p2)}" class="px-2.5 py-2 rounded-lg bg-[#090d16] border border-slate-700 text-xs font-mono text-white outline-none focus:border-cobaltbright" />
                <button onclick="AppModules.syscalls.invokeTest()" class="px-3 py-2 rounded-lg bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs font-mono transition">
                  Invoke Syscall
                </button>
              </div>
              ${this.lastResult ? `
                <div class="p-2.5 rounded-lg bg-[#090d16] border ${this.lastResult.errno === 0 ? 'border-acid/40 text-lime-300' : 'border-red-500/40 text-red-300'} text-xs font-mono break-all">
                  <strong>Return [${this.lastResult.status} / ${this.lastResult.errno}]</strong>: ${escapeHtml(this.lastResult.message)}
                  ${this.lastResult.data !== null && this.lastResult.data !== undefined ? `<div class="text-slate-400 mt-1">Payload: ${escapeHtml(typeof this.lastResult.data === 'string' ? this.lastResult.data.slice(0, 140) : JSON.stringify(this.lastResult.data))}</div>` : ''}
                </div>
              ` : ''}
            </div>

            <!-- Live Syscall Stream -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-2.5">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-200">Live Kernel Syscall Audit Stream</h4>
                <div class="flex items-center gap-1.5">
                  ${['ALL', 'OK', 'ERR'].map(f => `
                    <button onclick="AppModules.syscalls.filter='${f}'; AppModules.syscalls.render();"
                      class="px-2.5 py-1 rounded-lg text-[11px] font-mono border transition ${
                        this.filter === f ? 'bg-cobalt border-cobaltbright text-white' : 'bg-slate-900 border-slate-700 text-slate-400'
                      }">${f}</button>
                  `).join('')}
                </div>
              </div>

              <div class="overflow-x-auto max-h-72 overflow-y-auto">
                <table class="w-full text-[11px] font-mono">
                  <thead class="text-[10px] text-slate-400 border-b border-slate-800 sticky top-0 bg-slatepanel">
                    <tr>
                      <th class="py-1.5 text-left">#</th>
                      <th class="py-1.5 text-left">Time</th>
                      <th class="py-1.5 text-left">PID</th>
                      <th class="py-1.5 text-left">User</th>
                      <th class="py-1.5 text-left">Syscall</th>
                      <th class="py-1.5 text-left">Arguments</th>
                      <th class="py-1.5 text-right">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/60">
                    ${logs.slice(0, 60).map(s => `
                      <tr class="hover:bg-slate-800/40">
                        <td class="py-1.5 text-slate-500">${s.id}</td>
                        <td class="py-1.5 text-slate-400">${s.time}</td>
                        <td class="py-1.5 text-slate-300">${s.pid}</td>
                        <td class="py-1.5 text-cobaltbright">${escapeHtml(s.user)}</td>
                        <td class="py-1.5 font-semibold text-white">${s.name} <span class="text-slate-500">(${s.code})</span></td>

                        <td class="py-1.5 text-right">
                          <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${s.errno === 0 ? 'bg-acid/15 text-acid' : 'bg-red-500/20 text-red-300'}">${s.status}</span>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }
    };

    /* -----------------------------------------------------------------------

        this.render();
      },

      refresh() {
        if (this.container) this.render();
      },

      toggleModule(modName, load) {
        const res = Kernel.syscall(SYSCALL.SYS_INSMOD, { module: modName, action: load ? 'load' : 'unload' }, 107);
        if (res.errno !== 0) showToast('LKM Error', res.message, 'error');
        else showToast(load ? 'insmod OK' : 'rmmod OK', res.message, load ? 'success' : 'warn');
        this.render();
      },

      fileOp(op) {
        const devPath = `/dev/${this.selectedDev}`;
        let res;
        if (op === 'open') {
          res = Kernel.syscall(SYSCALL.SYS_OPEN, { path: devPath }, 107);
        } else if (op === 'read') {
          res = Kernel.syscall(SYSCALL.SYS_READ, { path: devPath }, 107);
        } else if (op === 'write') {
          const val = document.getElementById('drv-write-input')?.value || '';
          res = Kernel.syscall(SYSCALL.SYS_WRITE, { path: devPath, content: val }, 107);

          res = Kernel.syscall(SYSCALL.SYS_IOCTL, { device: this.selectedDev, cmd: 'IOCTL_RELEASE' }, 107);

        this.lastOutput = `[${res.status}] ${res.message}` + (typeof res.data === 'string' ? `\n>>> ${res.data}` : '');
