                    <span class="text-slate-500">[${d.uptime}]</span> ${escapeHtml(d.msg)}
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }
    };

    /* -----------------------------------------------------------------------
     * APP #9: DISK SCHEDULING ALGORITHM COMPARISON (6 Algos + SVG Trajectory)
     * ----------------------------------------------------------------------- */
    AppModules.disk = {
      algo: 'SCAN',
      maxCyl: 199,
      head: 53,
      direction: 'right',
      queueInput: '98, 183, 37, 122, 14, 124, 65, 67',

      mount(container) {
        this.container = container;
        this.render();
      },

      parseQueue() {
        const q = this.queueInput.split(/[\s,]+/).map(x => parseInt(x, 10)).filter(n => !isNaN(n) && n >= 0 && n <= this.maxCyl);
        return q.length > 0 ? q.slice(0, 20) : [98, 183, 37, 122, 14];
      },

      randomize() {
        this.head = Math.floor(Math.random() * (this.maxCyl - 20)) + 10;
        this.queueInput = Array.from({ length: 9 }, () => Math.floor(Math.random() * this.maxCyl)).join(', ');
        this.render();
      },

      simulate(algo, head, queue, maxCyl, dir) {
        let seq = [head];
        const reqs = [...queue];

        if (algo === 'FCFS') {
          seq.push(...reqs);
        } else if (algo === 'SSTF') {
          let cur = head;
          const rem = [...reqs];
          while (rem.length > 0) {
            let bestIdx = 0;
            let bestDist = Infinity;
            rem.forEach((r, idx) => {
              const d = Math.abs(r - cur);
              if (d < bestDist) { bestDist = d; bestIdx = idx; }
            });
            cur = rem.splice(bestIdx, 1)[0];
            seq.push(cur);
          }
        } else {
          const left = reqs.filter(r => r < head).sort((a, b) => a - b);
          const right = reqs.filter(r => r >= head).sort((a, b) => a - b);

          if (algo === 'SCAN') {
            if (dir === 'right') {
              seq.push(...right);
              if (left.length > 0) {
                if (seq[seq.length - 1] !== maxCyl) seq.push(maxCyl);
                seq.push(...left.reverse());
              }
            } else {
              seq.push(...left.reverse());
              if (right.length > 0) {
                if (seq[seq.length - 1] !== 0) seq.push(0);
                seq.push(...right);
              }
            }
          } else if (algo === 'C-SCAN') {
            if (dir === 'right') {
              seq.push(...right);
              if (left.length > 0) {
                if (seq[seq.length - 1] !== maxCyl) seq.push(maxCyl);
                seq.push(0);
                seq.push(...left);
              }
            } else {
              seq.push(...left.reverse());
              if (right.length > 0) {
                if (seq[seq.length - 1] !== 0) seq.push(0);
                seq.push(maxCyl);
                seq.push(...right.reverse());
              }
            }
          } else if (algo === 'LOOK') {
            if (dir === 'right') {
              seq.push(...right, ...left.reverse());
            } else {
              seq.push(...left.reverse(), ...right);
            }
          } else if (algo === 'C-LOOK') {
            if (dir === 'right') {
              seq.push(...right, ...left);
            } else {
              seq.push(...left.reverse(), ...right.reverse());
            }
          }
        }

        let movement = 0;
        for (let i = 1; i < seq.length; i++) movement += Math.abs(seq[i] - seq[i - 1]);
        const seekTimeMs = movement * 0.1; // 0.1 ms per cylinder
        const avgSeek = seekTimeMs / Math.max(1, reqs.length);
        const throughput = seekTimeMs > 0 ? (reqs.length / (seekTimeMs / 1000)) : 0;
        return { algo, seq, movement, seekTimeMs, avgSeek, throughput };
      },

      render() {
        const c = this.container;
        if (!c) return;
        const queue = this.parseQueue();
        const algos = ['FCFS', 'SSTF', 'SCAN', 'C-SCAN', 'LOOK', 'C-LOOK'];
        const results = algos.map(a => this.simulate(a, this.head, queue, this.maxCyl, this.direction));
        const active = results.find(r => r.algo === this.algo) || results[0];
        const minMove = Math.min(...results.map(r => r.movement));

        // SVG Trajectory Coordinates
        const svgW = 720;
        const svgH = 240;
        const padL = 36, padR = 24, padT = 26, padB = 22;
        const plotW = svgW - padL - padR;
        const plotH = svgH - padT - padB;
        const points = active.seq.map((cyl, idx) => {
          const x = padL + (cyl / this.maxCyl) * plotW;
          const y = padT + (idx / Math.max(1, active.seq.length - 1)) * plotH;
          return { cyl, x, y, idx };
        });
        const polyStr = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

        c.innerHTML = `
          <div class="p-4 space-y-4">
            <!-- Controls -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap gap-1.5">
                  ${algos.map(a => `
                    <button onclick="AppModules.disk.algo='${a}'; AppModules.disk.render();"
                      class="px-2.5 py-1.5 rounded-lg text-xs font-mono font-semibold border transition ${
                        this.algo === a ? 'bg-cobalt border-cobaltbright text-white' : 'bg-slate-900 border-slate-700 text-slate-300 hover:bg-slate-800'
                      }">${a}</button>
                  `).join('')}
                </div>
                <button onclick="AppModules.disk.randomize()" class="px-3 py-1.5 rounded-lg bg-cobalt/20 hover:bg-cobalt/30 border border-cobaltbright/40 text-xs font-mono text-blue-300">Random Workload</button>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-4 gap-2 text-xs font-mono">
                <label class="flex items-center gap-2 bg-[#090d16] px-2.5 py-1.5 rounded-lg border border-slate-700">
                  <span class="text-slate-400">Head:</span>
                  <input type="number" min="0" max="${this.maxCyl}" value="${this.head}" onchange="AppModules.disk.head=Math.min(AppModules.disk.maxCyl,Math.max(0,parseInt(this.value)||0)); AppModules.disk.render();"
                    class="w-14 bg-transparent text-acid font-bold outline-none" />
                </label>
                <label class="flex items-center gap-2 bg-[#090d16] px-2.5 py-1.5 rounded-lg border border-slate-700">
                  <span class="text-slate-400">Dir:</span>
                  <select onchange="AppModules.disk.direction=this.value; AppModules.disk.render();" class="bg-transparent text-white outline-none flex-1">
                    <option value="right" ${this.direction === 'right' ? 'selected' : ''}>Right (&rarr; 199)</option>
                    <option value="left" ${this.direction === 'left' ? 'selected' : ''}>Left (&larr; 0)</option>
                  </select>
                </label>
                <div class="sm:col-span-2 flex gap-1.5">
                  <input id="disk-q-input" type="text" value="${escapeHtml(this.queueInput)}"
                    onchange="AppModules.disk.queueInput=this.value; AppModules.disk.render();"
                    class="flex-1 px-2.5 py-1.5 rounded-lg bg-[#090d16] border border-slate-700 text-white outline-none focus:border-cobaltbright" />
                  <button onclick="AppModules.disk.queueInput=document.getElementById('disk-q-input').value; AppModules.disk.render();" class="px-3 py-1.5 rounded-lg bg-cobalt text-white font-semibold">Plot</button>
                </div>
              </div>
            </div>

            <!-- Interactive SVG Disk Head Trajectory Plot -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-2">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h4 class="text-xs font-bold uppercase tracking-wider text-sky-400">Disk Head Trajectory — ${active.algo} (Cylinders 0–${this.maxCyl})</h4>
                <span class="text-xs font-mono text-slate-300">Total Head Movement: <strong class="text-acid">${active.movement} cylinders</strong></span>
              </div>
              <div class="w-full overflow-x-auto bg-[#080c16] rounded-lg border border-slate-800 p-2">
                <svg viewBox="0 0 ${svgW} ${svgH}" class="w-full min-w-[500px] h-auto">
                  <!-- Vertical Cylinder Axis Gridlines -->
                  ${[0, 50, 100, 150, 199].map(cyl => {
                    const gx = padL + (cyl / this.maxCyl) * plotW;
                    return `
                      <line x1="${gx}" y1="${padT}" x2="${gx}" y2="${svgH - padB}" stroke="#1e293b" stroke-dasharray="3,3" />
                      <text x="${gx}" y="15" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="JetBrains Mono">${cyl}</text>
                    `;
                  }).join('')}
                  <!-- Trajectory Polyline -->
                  <polyline points="${polyStr}" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" />
                  <!-- Nodes -->
                  ${points.map((p, i) => `
                    <g>
                      <circle cx="${p.x}" cy="${p.y}" r="${i === 0 ? 5.5 : 4}" fill="${i === 0 ? '#84cc16' : '#3b82f6'}" stroke="#090d16" stroke-width="1.5">
                        <title>Step ${i}: Cylinder ${p.cyl}</title>
                      </circle>
                      <text x="${p.x}" y="${p.y - 7}" text-anchor="middle" fill="${i === 0 ? '#84cc16' : '#e2e8f0'}" font-size="9.5" font-family="JetBrains Mono" font-weight="600">${p.cyl}</text>
                    </g>
                  `).join('')}
                </svg>
              </div>
            </div>

            <!-- 6-Algorithm Comparison Table -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-2">
              <h4 class="text-xs font-bold uppercase tracking-wider text-slate-200">Full 6-Algorithm Seek Comparison (0.1 ms / cylinder)</h4>
              <div class="overflow-x-auto">
                <table class="w-full text-xs font-mono">
                  <thead class="text-[10px] text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="py-1.5 text-left">Algorithm</th>
                      <th class="py-1.5 text-right">Head Movement</th>
                      <th class="py-1.5 text-right">Avg Seek (ms)</th>
                      <th class="py-1.5 text-right">Throughput</th>
                      <th class="py-1.5 text-left pl-3">Seek Path</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/70">
                    ${results.map(r => {
                      const isBest = r.movement === minMove;
                      return `
                        <tr onclick="AppModules.disk.algo='${r.algo}'; AppModules.disk.render();" class="cursor-pointer hover:bg-slate-800/50 ${r.algo === this.algo ? 'bg-cobalt/15' : ''}">
                          <td class="py-2 font-bold text-white whitespace-nowrap">
                            ${r.algo}
                            ${isBest ? '<span class="ml-1 text-[9px] px-1.5 py-0.5 rounded bg-acid/20 text-acid">MIN</span>' : ''}
                          </td>
                          <td class="py-2 text-right font-bold text-cobaltbright">${r.movement} cyl</td>
                          <td class="py-2 text-right text-amber-300">${r.avgSeek.toFixed(2)} ms</td>
                          <td class="py-2 text-right text-acid">${r.throughput.toFixed(0)} req/s</td>
                          <td class="py-2 pl-3 text-[10px] text-slate-400 truncate max-w-[260px]" title="${r.seq.join(' -> ')}">${r.seq.join(' &rarr; ')}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      }
    };

    /* -----------------------------------------------------------------------
     * APP #10: SECURITY, PERMISSIONS BITMASK & AUDIT CENTER
     * ----------------------------------------------------------------------- */
    AppModules.security = {
      calcMode: 0o755,
      targetFile: 'notes.txt',

      mount(container) {
        this.container = container;
        this.render();
      },

      refresh() {
        if (this.container) this.render();
      },

      toggleBit(bitMask) {
        this.calcMode ^= bitMask;
        this.render();
      },

      applyCalcChmod() {
        const file = document.getElementById('sec-chmod-file')?.value || this.targetFile;
        const octal = modeToOctalString(this.calcMode);
        const res = Kernel.syscall(SYSCALL.SYS_CHMOD, { path: file, mode: octal }, 110);
        if (res.errno !== 0) showToast('chmod Denied', res.message, 'error');
        else showToast('Permissions Applied', `chmod ${octal} ${file}`, 'success');
        this.render();
      },

      unlockUser(uname) {
        Kernel.syscall(SYSCALL.SYS_AUTH, { action: 'UNLOCK_USER', target: uname }, 110);
        showToast('Account Unlocked', `Reset failed attempts for ${uname}`, 'success');
        this.render();
      },

      render() {
        const c = this.container;
        if (!c) return;
        const users = Object.values(Kernel.users);
        const files = Object.keys(Kernel.fs.directory).sort();
        if (!files.includes(this.targetFile) && files.length > 0) this.targetFile = files[0];

        const octalStr = modeToOctalString(this.calcMode);
        const rwxStr = modeToRwx(this.calcMode);
        const binStr = [6, 3, 0].map(shift => ((this.calcMode >> shift) & 7).toString(2).padStart(3, '0')).join(' ');

        c.innerHTML = `
          <div class="p-4 space-y-4">
            <!-- Users & Lockout Table -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-2.5">
              <div class="flex items-center justify-between">
                <h3 class="text-xs font-bold uppercase tracking-wider text-rose-400">User Database (SHA-256) &amp; 5-Attempt Lockout Policy</h3>
                <button onclick="Kernel.syscall(SYSCALL.SYS_AUTH, {action:'UNLOCK_ALL'}, 110); AppModules.security.render();"
                  class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-[11px] font-mono text-amber-300 border border-slate-700">Reset All Lockouts</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-xs font-mono">
                  <thead class="text-[10px] text-slate-400 border-b border-slate-800">
                    <tr>
                      <th class="py-1.5 text-left">User</th>
                      <th class="py-1.5 text-left">UID:GID</th>
                      <th class="py-1.5 text-left">Role</th>
                      <th class="py-1.5 text-left">SHA-256 Digest</th>
                      <th class="py-1.5 text-center">Fails</th>
                      <th class="py-1.5 text-right">Status / Action</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-800/70">
                    ${users.map(u => `
                      <tr>
                        <td class="py-2 font-bold text-white">${escapeHtml(u.username)}</td>
                        <td class="py-2 text-slate-400">${u.uid}:${u.gid}</td>
                        <td class="py-2 text-cobaltbright">${u.role}</td>
                        <td class="py-2 text-slate-500 text-[10px]">${u.passwordHash.slice(0, 18)}...</td>
                        <td class="py-2 text-center ${u.failedAttempts > 0 ? 'text-amber-400 font-bold' : 'text-slate-400'}">${u.failedAttempts}/5</td>
                        <td class="py-2 text-right">
                          ${u.locked
                            ? `<button onclick="AppModules.security.unlockUser('${escapeHtml(u.username)}')" class="px-2 py-0.5 rounded bg-red-500/20 hover:bg-amber-500/25 text-red-300 hover:text-amber-200 border border-red-500/40 text-[10px]">LOCKED (Unlock)</button>`
                            : `<span class="px-2 py-0.5 rounded bg-acid/15 text-acid text-[10px]">ACTIVE</span>`
                          }
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Interactive Octal chmod Bitmask Calculator -->
            <div class="bg-slatepanel p-3.5 rounded-xl border border-slate-800 space-y-3">
              <div class="flex flex-wrap items-center justify-between gap-2">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-200">Linux Permission Bitmask Calculator (chmod)</h4>
                <div class="flex items-center gap-2 font-mono text-xs">
                  <span class="px-2 py-0.5 rounded bg-cobalt/20 text-cobaltbright border border-cobaltbright/40 font-bold">Octal: ${octalStr}</span>
                  <span class="px-2 py-0.5 rounded bg-acid/15 text-acid border border-acid/40">${rwxStr}</span>
                  <span class="hidden sm:inline text-slate-400 text-[11px]">Bin: ${binStr}</span>
                </div>
              </div>

              <div class="grid grid-cols-3 gap-2.5 text-xs font-mono">
                ${[
                  { label: 'Owner (u)', shift: 6 },
                  { label: 'Group (g)', shift: 3 },
                  { label: 'Other (o)', shift: 0 },
                ].map(grp => `
                  <div class="p-2.5 rounded-lg bg-[#090d16] border border-slate-800 space-y-1.5">
                    <div class="text-[11px] font-bold text-slate-300">${grp.label}</div>
                    ${[
                      { name: 'Read (4)', bit: 4 },
                      { name: 'Write (2)', bit: 2 },
                      { name: 'Exec (1)', bit: 1 },
                    ].map(b => {
                      const mask = b.bit << grp.shift;
                      const checked = (this.calcMode & mask) === mask;
                      return `
                        <label class="flex items-center gap-2 cursor-pointer text-[11px] text-slate-300 hover:text-white">
                          <input type="checkbox" ${checked ? 'checked' : ''} onchange="AppModules.security.toggleBit(${mask})" class="accent-cobaltbright rounded" />
                          <span>${b.name}</span>
                        </label>
                      `;
                    }).join('')}
                  </div>
                `).join('')}
              </div>

              <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-mono text-slate-400">Apply to FAT file:</span>
                  <select id="sec-chmod-file" onchange="AppModules.security.targetFile=this.value" class="px-2.5 py-1 rounded-lg bg-[#090d16] border border-slate-700 text-xs font-mono text-white">
                    ${files.map(f => `<option value="${escapeHtml(f)}" ${f === this.targetFile ? 'selected' : ''}>${escapeHtml(f)}</option>`).join('')}
                  </select>
                </div>
                <button onclick="AppModules.security.applyCalcChmod()" class="px-3.5 py-1.5 rounded-lg bg-cobalt hover:bg-cobaltbright text-white text-xs font-semibold font-mono transition">
                  Apply chmod ${octalStr} (SYS_CHMOD)
                </button>
              </div>
            </div>

            <!-- Live Security Audit Log -->
            <div class="bg-[#070b14] p-3.5 rounded-xl border border-slate-800 space-y-2">
              <div class="flex items-center justify-between">
                <h4 class="text-xs font-bold uppercase tracking-wider text-slate-200">Timestamped Security Audit Log</h4>
                <span class="text-[11px] font-mono text-slate-500">${Kernel.auditLog.length} events</span>
              </div>
              <div class="max-h-52 overflow-y-auto space-y-1 font-mono text-[11px]">
                ${Kernel.auditLog.slice(0, 40).map(a => {
                  const sevCls = a.severity === 'ALERT'
                    ? 'text-red-400 border-red-500/30 bg-red-950/25'
                    : a.severity === 'WARN'
                      ? 'text-amber-300 border-amber-500/30 bg-amber-950/20'
                      : a.severity === 'SUCCESS'
                        ? 'text-lime-300 border-acid/25 bg-lime-950/15'
                        : 'text-slate-300 border-slate-800 bg-slate-900/40';
                  return `
                    <div class="px-2.5 py-1.5 rounded-lg border ${sevCls} flex flex-wrap items-center gap-x-2">
                      <span class="text-slate-500 text-[10px]">[${a.time}]</span>
                      <span class="font-bold">${a.eventType}</span>
                      <span class="text-cobaltbright">${escapeHtml(a.user)}</span>
                      <span class="text-slate-300">${escapeHtml(a.detail)}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      }
    };

    /* =======================================================================
     * SUBSCRIBE LIVE APPS TO KERNEL EVENTS & BOOT SYSTEM
     * ======================================================================= */
    Kernel.on('fs', () => {
      if (WindowManager.windows.files) AppModules.files.refresh();
      if (WindowManager.windows.security) AppModules.security.refresh();
    });
    Kernel.on('syscalls', () => {
      if (WindowManager.windows.syscalls) AppModules.syscalls.refresh();
    });
    Kernel.on('audit', () => {
      if (WindowManager.windows.security) AppModules.security.refresh();
    });
    Kernel.on('users', () => {
      if (WindowManager.windows.security) AppModules.security.refresh();
    });
    Kernel.on('drivers', () => {
      if (WindowManager.windows.drivers) AppModules.drivers.refresh();
    });
    Kernel.on('dmesg', () => {
      if (WindowManager.windows.drivers) AppModules.drivers.refresh();
    });
    Kernel.on('sockets', () => {
      if (WindowManager.windows.sockets) AppModules.sockets.refresh();
    });

    // Boot Kernel on Window Load
    window.addEventListener('DOMContentLoaded', async () => {
      await Kernel.init();
      // Pre-fill student for one-click convenience while still showing login screen
      document.getElementById('login-username').value = 'student';
      document.getElementById('login-password').value = 'os2026';
    });
  </script>
</body>
</html>
