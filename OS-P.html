<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            midnight: '#090d16',
            slatepanel: '#111827',
            slateelev: '#1e293b',
            cobalt: '#2563eb',
            cobaltbright: '#3b82f6',
            acid: '#84cc16',

        }
      }

  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #090d16;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, sans-serif;
      user-select: none;
    }

    /* Engineering Blueprint Desktop Background */
    .os-wallpaper {
      background-color: #090d16;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(37, 99, 235, 0.14), transparent 45%),
        radial-gradient(circle at 82% 75%, rgba(132, 204, 22, 0.08), transparent 40%),
        linear-gradient(rgba(148, 163, 184, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.045) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 36px 36px, 36px 36px;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #0b1120;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Window Shell */
    .os-window {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: rgba(17, 24, 39, 0.96);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(51, 65, 85, 0.9);
      border-radius: 12px;
      box-shadow: 0 22px 50px -12px rgba(0, 0, 0, 0.72), 0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      overflow: hidden;
      min-width: 310px;
      min-height: 240px;
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .os-window.focused {
      border-color: rgba(59, 130, 246, 0.7);
      box-shadow: 0 26px 65px -10px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(59, 130, 246, 0.25);
    }

    .os-window.maximized {
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: calc(100% - 52px) !important;
      border-radius: 0 !important;
    }

    .os-window-body {
      flex: 1;
      overflow: auto;
      user-select: text;
      background: #0d1322;
    }

    /* Resize Handle */
    .resize-handle {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 18px;
      height: 18px;
      cursor: nwse-resize;
      z-index: 20;
      background: linear-gradient(135deg, transparent 50%, rgba(148, 163, 184, 0.35) 50%, rgba(148, 163, 184, 0.35) 62%, transparent 62%, transparent 74%, rgba(148, 163, 184, 0.55) 74%);
      border-bottom-right-radius: 10px;
    }

    /* Terminal Input Reset */
    .term-input {
      background: transparent;
      border: none;
      outline: none;
      color: #f8fafc;
      font-family: 'JetBrains Mono', monospace;
      width: 100%;
    }

    /* Subtle Pulse */
    @keyframes pulseSoft {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .pulse-dot {
      animation: pulseSoft 2s infinite;
    }

    /* Toast Animation */
    @keyframes slideInRight {
      from { transform: translateX(24px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .toast-anim {
      animation: slideInRight 0.2s ease-out forwards;
    }
  </style>
</head>

  <!-- 3. CORE OS KERNEL & ALL 10 SUBSYSTEMS (JavaScript)                    -->
  <!-- ===================================================================== -->
  <script>
    'use strict';

    /* =======================================================================
     * UTILITY FUNCTIONS & PURE-JS SHA-256 FALLBACK
     * ======================================================================= */
    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function nowTimeStr() {
      const d = new Date();
      return d.toTimeString().split(' ')[0];
    }

    function nowTimestamp() {
      const d = new Date();
      return d.toISOString().replace('T', ' ').slice(0, 19);
    }

    // Pure-JS deterministic SHA-256 fallback (for sandboxed/non-HTTPS contexts)
    function sha256Fallback(ascii) {
      function rightRotate(value, amount) {
        return (value >>> amount) | (value << (32 - amount));
      }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      let result = '';
      const words = [];
      const asciiBitLength = ascii.length * 8;
      let hash = sha256Fallback.h = sha256Fallback.h || [];
      const k = sha256Fallback.k = sha256Fallback.k || [];
      let primeCounter = k.length;
      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while ((ascii.length % 64) - 56) ascii += '\x00';
      for (let i = 0; i < ascii.length; i++) {
        const j = ascii.charCodeAt(i);
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words.length] = (asciiBitLength / maxWord) | 0;
      words[words.length] = asciiBitLength;

      const h = hash.slice(0, 8);
      for (let j = 0; j < words.length;) {
        const w = words.slice(j, (j += 16));
        const oldHash = h.slice(0);
        for (let i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = h[0], e = h[4];
          const temp1 = h[7]
            + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
            + ((e & h[5]) ^ ((~e) & h[6]))
            + k[i]
            + (w[i] = (i < 16) ? w[i] : (
                w[i - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3))
                + w[i - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))
              ) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
            + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
          h.unshift((temp1 + temp2) | 0);
          h[4] = (h[4] + temp1) | 0;
          h.pop();
        }
        for (let i = 0; i < 8; i++) h[i] = (h[i] + oldHash[i]) | 0;
      }
      for (let i = 0; i < 8; i++) {
        for (let j = 3; j + 1; j--) {
          const b = (h[i] >> (j * 8)) & 255;
          result += (b < 16 ? '0' : '') + b.toString(16);
        }
      }
      return result;
    }

    async function hashPasswordSHA256(plainText) {
      try {
        if (window.crypto && window.crypto.subtle) {
          const enc = new TextEncoder().encode(plainText);
          const buf = await window.crypto.subtle.digest('SHA-256', enc);
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }
      } catch (e) {
        // Fallback below
      }
      return sha256Fallback(plainText);
    }

    function modeToOctalString(mode) {
      return (mode & 0o777).toString(8).padStart(3, '0');
    }

    function modeToRwx(mode) {
      const bits = [
        [0o400, 'r'], [0o200, 'w'], [0o100, 'x'],
        [0o040, 'r'], [0o020, 'w'], [0o010, 'x'],
        [0o004, 'r'], [0o002, 'w'], [0o001, 'x'],
      ];
      return bits.map(([mask, ch]) => (mode & mask ? ch : '-')).join('');
    }

    function showToast(title, message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const colors = {
        info: 'border-cobaltbright/60 bg-slatepanel/95 text-blue-200',
        success: 'border-acid/60 bg-slatepanel/95 text-lime-200',
        warn: 'border-amber-500/60 bg-slatepanel/95 text-amber-200',
        error: 'border-red-500/60 bg-slatepanel/95 text-red-200',
      };
      const dot = {
        info: 'bg-cobaltbright',
        success: 'bg-acid',
        warn: 'bg-amber-400',
        error: 'bg-red-500',
      };
      const el = document.createElement('div');
      el.className = `toast-anim pointer-events-auto rounded-xl border p-3 shadow-2xl backdrop-blur-md ${colors[type] || colors.info}`;
      el.innerHTML = `
        <div class="flex items-start gap-2.5">
          <span class="w-2 h-2 mt-1.5 rounded-full shrink-0 ${dot[type] || dot.info}"></span>
          <div class="min-w-0 flex-1">
            <div class="text-xs font-bold text-white">${escapeHtml(title)}</div>
            <div class="text-[11px] font-mono opacity-90 break-words mt-0.5">${escapeHtml(message)}</div>
          </div>
        </div>
      `;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 3200);
    }

    /* =======================================================================
     * CENTRAL IN-MEMORY KERNEL ARCHITECTURE
     * Connects Auth, Syscalls, FAT-128 FS, Processes, Drivers, & Sockets
     * ======================================================================= */
    const SYSCALL = {

      },

      /* -------------------------------------------------------------------
       * PERMISSION CHECKER (Linux rwx bitflags)
       * permBit: 4 = read, 2 = write, 1 = execute
       * ------------------------------------------------------------------- */
      checkPermission(fileEntry, user, permBit) {
        if (!user) return false;
        if (user.uid === 0 || user.role === 'admin') return true; // root superuser
        const mode = fileEntry.mode;
        if (fileEntry.owner === user.username) {
          return ((mode >> 6) & permBit) === permBit;
        }
        if (fileEntry.gid === user.gid) {
          return ((mode >> 3) & permBit) === permBit;
        }
        return (mode & permBit) === permBit;
      },

      /* -------------------------------------------------------------------
       * INTERNAL FAT-128 HELPERS
       * ------------------------------------------------------------------- */
      _fsFreeBlocks(startBlock) {
        if (startBlock < 0) return;
        let curr = startBlock;
        let guard = 0;
        while (curr >= 0 && curr < this.fs.NUM_BLOCKS && guard++ < this.fs.NUM_BLOCKS) {
          const next = this.fs.fat[curr];
          this.fs.fat[curr] = -1;
          this.fs.disk[curr] = '';
          if (next === -2) break;
          curr = next;
        }
      },

      _fsGetChain(startBlock) {
        const chain = [];
        if (startBlock < 0) return chain;
        let curr = startBlock;
        let guard = 0;
        while (curr >= 0 && curr < this.fs.NUM_BLOCKS && guard++ < this.fs.NUM_BLOCKS) {
          chain.push(curr);
          const next = this.fs.fat[curr];
          if (next === -2 || next === -1) break;
          curr = next;
        }
        return chain;
      },

      _fsFindFreeBlocks(count) {
        const free = [];
        for (let i = 0; i < this.fs.NUM_BLOCKS && free.length < count; i++) {
          if (this.fs.fat[i] === -1) free.push(i);
        }
        return free.length === count ? free : null;
      },

      _fsWriteInternal(name, content, owner, gid, mode) {
        const text = String(content ?? '');
        const needed = Math.max(1, Math.ceil(text.length / this.fs.BLOCK_SIZE));
        const existing = this.fs.directory[name];

        // Temporarily record old chain in case of ENOSPC rollback
        const oldChain = existing ? this._fsGetChain(existing.startBlock) : [];
        const freeCount = this.fs.fat.reduce((acc, v) => acc + (v === -1 ? 1 : 0), 0);
        if (freeCount + oldChain.length < needed) {
          return { ok: false, err: ERRNO.ENOSPC };
        }

        if (existing) {
          this._fsFreeBlocks(existing.startBlock);
        }

        const blocks = this._fsFindFreeBlocks(needed);
        if (!blocks) return { ok: false, err: ERRNO.ENOSPC };

        for (let i = 0; i < blocks.length; i++) {
          const bIdx = blocks[i];
          this.fs.disk[bIdx] = text.slice(i * this.fs.BLOCK_SIZE, (i + 1) * this.fs.BLOCK_SIZE);
          this.fs.fat[bIdx] = (i === blocks.length - 1) ? -2 : blocks[i + 1];
        }

        const ts = nowTimestamp();
        this.fs.directory[name] = {
          name,
          owner: existing ? existing.owner : owner,
          gid: existing ? existing.gid : gid,
          mode: existing ? existing.mode : mode,
          size: text.length,
          startBlock: blocks[0],
          createdAt: existing ? existing.createdAt : ts,
          modifiedAt: ts,
        };
        return { ok: true, entry: this.fs.directory[name], blocks };
      },

      _fsReadInternal(name) {
        const entry = this.fs.directory[name];
        if (!entry) return null;
        const chain = this._fsGetChain(entry.startBlock);
        return chain.map(b => this.fs.disk[b]).join('');
      },

      /* -------------------------------------------------------------------
       * CENTRAL SYSTEM CALL DISPATCHER (#6 System Call Interface)
       * ------------------------------------------------------------------- */
      syscall(code, args = {}, pid = 100) {
        const name = SYSCALL_NAMES[code] || `UNKNOWN(${code})`;
        const user = this.currentUser;
        const username = user ? user.username : (args.username || 'kernel');
        let result = { status: ERRNO.EINVAL.name, errno: ERRNO.EINVAL.code, data: null, message: 'Invalid syscall' };

        try {
          switch (Number(code)) {
            /* SYS_OPEN (1): validate file or /dev path & check access */
            case SYSCALL.SYS_OPEN: {
              const path = (args.path || '').trim();
              if (!path) {
                result = { status: 'EINVAL', errno: -22, data: null, message: 'Missing path argument' };
                break;
              }
              if (path.startsWith('/dev/')) {
                const modName = path.replace('/dev/', '');
                const mod = this.modules[modName];
                if (!mod || !mod.loaded) {
                  result = { status: 'ENODEV', errno: -19, data: null, message: `No such loaded device: ${path}` };
                } else {
                  const fd = this.nextFd++;
                  mod.openFds.push(fd);
                  this.logDmesg(`${mod.name}: open() assigned fd=${fd} by ${username}`);
                  this.emit('drivers');
                  result = { status: 'OK', errno: 0, data: { fd, device: path }, message: `Opened ${path} (fd=${fd})` };
                }
              } else {
                const entry = this.fs.directory[path];
                if (!entry) {
                  if (args.create) {
                    const wr = this._fsWriteInternal(path, '', username, user ? user.gid : 100, 0o644);
                    if (!wr.ok) {
                      result = { status: 'ENOSPC', errno: -28, data: null, message: 'No space left on FAT-128 disk' };
                    } else {
                      this.emit('fs');
                      result = { status: 'OK', errno: 0, data: { fd: this.nextFd++, entry: wr.entry }, message: `Created & opened ${path}` };
                    }
                  } else {
                    result = { status: 'ENOENT', errno: -2, data: null, message: `File not found: ${path}` };
                  }
                } else if (!this.checkPermission(entry, user, 4)) {
                  this.logAudit('PERM_DENIED', username, `SYS_OPEN denied on ${path} (mode ${modeToOctalString(entry.mode)})`, 'ALERT');
                  result = { status: 'EACCES', errno: -13, data: null, message: `Permission denied: ${path}` };
                } else {
                  result = { status: 'OK', errno: 0, data: { fd: this.nextFd++, entry }, message: `Opened ${path}` };
                }
              }
              break;
            }

            /* SYS_READ (2): read FAT file or /dev device */
            case SYSCALL.SYS_READ: {
              const path = (args.path || '').trim();
              if (!path) {
                result = { status: 'EINVAL', errno: -22, data: null, message: 'Missing path argument' };
                break;
              }
              if (path.startsWith('/dev/')) {
                const modName = path.replace('/dev/', '');
                const mod = this.modules[modName];
                if (!mod || !mod.loaded) {
                  result = { status: 'ENODEV', errno: -19, data: null, message: `Device not loaded: ${path}` };
                } else if (modName === 'vchar0') {
                  let out = mod.buffer;
                  if (mod.mode === 'UPPERCASE') out = out.toUpperCase();
                  else if (mod.mode === 'REVERSE') out = out.split('').reverse().join('');
                  this.logDmesg(`vchar0: read() returned ${out.length} bytes [mode=${mod.mode}]`);
                  result = { status: 'OK', errno: 0, data: out, message: `Read ${out.length} bytes from ${path}` };
                } else if (modName === 'vrand0') {
                  // Deterministic LCG entropy generator
                  let bytes = [];
                  for (let i = 0; i < 16; i++) {
                    mod.seed = (mod.seed * 1664525 + 1013904223) >>> 0;
                    bytes.push((mod.seed >>> 16) & 0xff);
                  }
                  const out = mod.format === 'BINARY'
                    ? bytes.slice(0, 6).map(b => b.toString(2).padStart(8, '0')).join(' ')
                    : bytes.map(b => b.toString(16).padStart(2, '0')).join(' ');
                  this.logDmesg(`vrand0: read() generated 16B entropy [${mod.format}]`);
                  result = { status: 'OK', errno: 0, data: out, message: `Read 16B entropy from ${path}` };
                }
              } else {
                const entry = this.fs.directory[path];
                if (!entry) {
                  result = { status: 'ENOENT', errno: -2, data: null, message: `No such file: ${path}` };
                } else if (!this.checkPermission(entry, user, 4)) {
                  this.logAudit('PERM_DENIED', username, `SYS_READ denied on ${path} (owner=${entry.owner}, mode=${modeToOctalString(entry.mode)})`, 'ALERT');
                  result = { status: 'EACCES', errno: -13, data: null, message: `Permission denied reading ${path}` };
                } else {
                  const content = this._fsReadInternal(path);
                  result = { status: 'OK', errno: 0, data: content, message: `Read ${content.length} bytes from ${path}` };
                }
              }
              break;
            }

            /* SYS_WRITE (3): write to FAT file or /dev device */
            case SYSCALL.SYS_WRITE: {
              const path = (args.path || '').trim();
              const content = args.content !== undefined ? String(args.content) : '';
              if (!path || /[\/\\]/.test(path.replace(/^\/dev\//, ''))) {
                result = { status: 'EINVAL', errno: -22, data: null, message: 'Invalid filename or path' };
                break;
              }
              if (path.startsWith('/dev/')) {
                const modName = path.replace('/dev/', '');
                const mod = this.modules[modName];
                if (!mod || !mod.loaded) {
                  result = { status: 'ENODEV', errno: -19, data: null, message: `Device not loaded: ${path}` };
                } else if (modName === 'vchar0') {
                  mod.buffer = content;
                  this.logDmesg(`vchar0: write() stored ${content.length} bytes into ring buffer`);
                  this.emit('drivers');
                  result = { status: 'OK', errno: 0, data: { bytes: content.length }, message: `Wrote ${content.length}B to ${path}` };
                } else if (modName === 'vrand0') {
                  let hash = 0;
                  for (let i = 0; i < content.length; i++) hash = ((hash << 5) - hash + content.charCodeAt(i)) | 0;
                  mod.seed = (Math.abs(hash) || Date.now()) >>> 0;
                  this.logDmesg(`vrand0: write() mixed ${content.length}B into entropy seed (${mod.seed})`);
                  this.emit('drivers');
                  result = { status: 'OK', errno: 0, data: { seed: mod.seed }, message: `Reseeded ${path}` };
                }
              } else {
                const existing = this.fs.directory[path];
                if (existing && !this.checkPermission(existing, user, 2)) {
                  this.logAudit('PERM_DENIED', username, `SYS_WRITE denied on ${path} (mode ${modeToOctalString(existing.mode)})`, 'ALERT');
                  result = { status: 'EACCES', errno: -13, data: null, message: `Permission denied writing ${path}` };
                  break;
                }
                const finalContent = (args.append && existing) ? (this._fsReadInternal(path) + content) : content;
                const wr = this._fsWriteInternal(path, finalContent, username, user ? user.gid : 100, args.mode ?? 0o644);
                if (!wr.ok) {
                  result = { status: 'ENOSPC', errno: -28, data: null, message: 'FAT-128 Disk Full (ENOSPC)' };
                } else {
                  this.emit('fs');
                  result = { status: 'OK', errno: 0, data: { bytes: finalContent.length, blocks: wr.blocks }, message: `Wrote ${finalContent.length}B (${wr.blocks.length} blk)` };
                }
              }
              break;
            }

            /* SYS_UNLINK (4): delete file from FAT-128 */
            case SYSCALL.SYS_UNLINK: {
              const path = (args.path || '').trim();
              const entry = this.fs.directory[path];
              if (!path) {
                result = { status: 'EINVAL', errno: -22, data: null, message: 'Missing filename' };
              } else if (!entry) {
                result = { status: 'ENOENT', errno: -2, data: null, message: `No such file: ${path}` };
              } else if (!this.checkPermission(entry, user, 2)) {
                this.logAudit('PERM_DENIED', username, `SYS_UNLINK denied on ${path}`, 'ALERT');
                result = { status: 'EACCES', errno: -13, data: null, message: `Permission denied deleting ${path}` };
              } else {
                this._fsFreeBlocks(entry.startBlock);
                delete this.fs.directory[path];
                this.emit('fs');
                result = { status: 'OK', errno: 0, data: { deleted: path }, message: `Unlinked ${path} & freed FAT blocks` };
              }
              break;
            }

            /* SYS_CHMOD (5): change octal permissions */
            case SYSCALL.SYS_CHMOD: {
              const path = (args.path || '').trim();
              const octalStr = String(args.mode ?? '').trim();
              const entry = this.fs.directory[path];
              if (!entry) {
                result = { status: 'ENOENT', errno: -2, data: null, message: `No such file: ${path}` };
              } else if (!/^[0-7]{3}$/.test(octalStr)) {
                result = { status: 'EINVAL', errno: -22, data: null, message: `Invalid octal mode: ${octalStr}` };
              } else if (user.uid !== 0 && entry.owner !== user.username) {
                this.logAudit('PERM_DENIED', username, `SYS_CHMOD denied on ${path} (not owner)`, 'ALERT');
                result = { status: 'EACCES', errno: -13, data: null, message: `Only owner (${entry.owner}) or root can chmod` };
              } else {
                entry.mode = parseInt(octalStr, 8);
                entry.modifiedAt = nowTimestamp();
                this.logAudit('CHMOD', username, `Changed ${path} mode to ${octalStr} (${modeToRwx(entry.mode)})`, 'INFO');
                this.emit('fs');
                result = { status: 'OK', errno: 0, data: { mode: octalStr, rwx: modeToRwx(entry.mode) }, message: `chmod ${octalStr} ${path}` };
              }
              break;
            }

            /* SYS_FORK (6): spawn process entry */
            case SYSCALL.SYS_FORK: {
              const procName = (args.name || 'child_proc').trim();
              const newPid = this.nextPid++;
              const proc = {
                pid: newPid,
                user: username,
                name: procName,
                state: 'RUNNING',
                cpu: +(Math.random() * 2.5 + 0.2).toFixed(1),
                mem: `${(Math.random() * 8 + 1.5).toFixed(1)}M`,
              };
              this.processes.push(proc);
              if (this.processes.length > 24) {
                // Keep core daemons + recent processes
                const idx = this.processes.findIndex(p => p.pid >= 105);
                if (idx >= 0) this.processes.splice(idx, 1);
              }
              this.emit('processes');
              result = { status: 'OK', errno: 0, data: proc, message: `Forked PID ${newPid} (${procName})` };
              break;
            }

            /* SYS_IOCTL (7): device-specific control commands */
            case SYSCALL.SYS_IOCTL: {
              const dev = (args.device || '').replace('/dev/', '').trim();
              const cmd = (args.cmd || '').trim();
              const mod = this.modules[dev];
              if (!mod || !mod.loaded) {
                result = { status: 'ENODEV', errno: -19, data: null, message: `Device /dev/${dev} not loaded` };
                break;
              }
              if (dev === 'vchar0') {
                if (cmd === 'IOCTL_FLUSH') {
                  mod.buffer = '';
                  this.logDmesg('vchar0: ioctl(IOCTL_FLUSH) cleared kernel buffer');
                  result = { status: 'OK', errno: 0, data: { mode: mod.mode, buffer: '' }, message: 'Flushed /dev/vchar0 buffer' };
                } else if (cmd === 'IOCTL_UPPERCASE_MODE') {
                  mod.mode = 'UPPERCASE';
                  this.logDmesg('vchar0: ioctl(IOCTL_UPPERCASE_MODE) enabled');
                  result = { status: 'OK', errno: 0, data: { mode: mod.mode }, message: 'Set UPPERCASE transform mode' };
                } else if (cmd === 'IOCTL_REVERSE_MODE') {
                  mod.mode = 'REVERSE';
                  this.logDmesg('vchar0: ioctl(IOCTL_REVERSE_MODE) enabled');
                  result = { status: 'OK', errno: 0, data: { mode: mod.mode }, message: 'Set REVERSE transform mode' };
                } else if (cmd === 'IOCTL_NORMAL_MODE') {
                  mod.mode = 'NORMAL';
                  this.logDmesg('vchar0: ioctl(IOCTL_NORMAL_MODE) enabled');
                  result = { status: 'OK', errno: 0, data: { mode: mod.mode }, message: 'Set NORMAL pass-through mode' };
                } else if (cmd === 'IOCTL_RELEASE') {
                  const closed = mod.openFds.pop();
                  this.logDmesg(`vchar0: release() closed fd=${closed ?? 'none'}`);
                  result = { status: 'OK', errno: 0, data: { closed }, message: `Released fd=${closed ?? 'none'}` };
                } else {
                  result = { status: 'EINVAL', errno: -22, data: null, message: `Unknown ioctl command: ${cmd}` };
                }
              } else if (dev === 'vrand0') {
                if (cmd === 'IOCTL_RESEED' || cmd === 'IOCTL_FLUSH') {
                  mod.seed = (Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0;
                  this.logDmesg(`vrand0: ioctl(${cmd}) reseeded entropy pool -> ${mod.seed}`);
                  result = { status: 'OK', errno: 0, data: { seed: mod.seed }, message: `Reseeded /dev/vrand0 (${mod.seed})` };
                } else if (cmd === 'IOCTL_HEX_MODE') {
                  mod.format = 'HEX';
                  this.logDmesg('vrand0: ioctl(IOCTL_HEX_MODE) output format = HEX');
                  result = { status: 'OK', errno: 0, data: { format: 'HEX' }, message: 'Set HEX output format' };
                } else if (cmd === 'IOCTL_BINARY_MODE') {
                  mod.format = 'BINARY';
                  this.logDmesg('vrand0: ioctl(IOCTL_BINARY_MODE) output format = BINARY');
                  result = { status: 'OK', errno: 0, data: { format: 'BINARY' }, message: 'Set BINARY output format' };
                } else if (cmd === 'IOCTL_RELEASE') {
                  const closed = mod.openFds.pop();
                  this.logDmesg(`vrand0: release() closed fd=${closed ?? 'none'}`);
                  result = { status: 'OK', errno: 0, data: { closed }, message: `Released fd=${closed ?? 'none'}` };
                } else {
                  result = { status: 'EINVAL', errno: -22, data: null, message: `Unknown ioctl command: ${cmd}` };
                }
              }
              this.emit('drivers');
              break;
            }

            /* SYS_SOCKET (8): IPC socket operations */
            case SYSCALL.SYS_SOCKET: {
              const op = (args.op || 'STATUS').toUpperCase();
              if (op === 'START_SERVER') {
                this.sockets.serverState = 'LISTENING';
                this.sockets.packetTrace.unshift(
                  { time: nowTimeStr(), call: 'listen(3, backlog=16)', detail: '127.0.0.1:8080 LISTENING', status: 'OK' },
                  { time: nowTimeStr(), call: 'bind(3, 127.0.0.1:8080)', detail: 'address bound', status: 'OK' },
                  { time: nowTimeStr(), call: 'socket(AF_INET, SOCK_STREAM)', detail: 'fd=3 allocated', status: 'OK' }
                );
                this.sockets.messages.push({ time: nowTimeStr(), from: 'SERVER', text: 'TCP Server started & listening on 127.0.0.1:8080', sys: true });
                result = { status: 'OK', errno: 0, data: { state: 'LISTENING' }, message: 'TCP Server listening on :8080' };
              } else if (op === 'STOP_SERVER') {
                this.sockets.serverState = 'STOPPED';
                this.sockets.clients.forEach(c => c.connected = false);
                this.sockets.packetTrace.unshift({ time: nowTimeStr(), call: 'close(3)', detail: 'server socket closed', status: 'OK' });
                this.sockets.messages.push({ time: nowTimeStr(), from: 'SERVER', text: 'TCP Server stopped. All client threads terminated.', sys: true });
                result = { status: 'OK', errno: 0, data: { state: 'STOPPED' }, message: 'TCP Server stopped' };
              } else if (op === 'SEND') {
                if (this.sockets.serverState !== 'LISTENING') {
                  result = { status: 'ENODEV', errno: -19, data: null, message: 'Server socket not listening' };
                  break;
                }
                const sender = this.sockets.clients.find(c => c.id === args.clientId);
                if (!sender || !sender.connected) {
                  result = { status: 'EINVAL', errno: -22, data: null, message: 'Client not connected' };
                  break;
                }
                const text = String(args.text || '').trim();
                if (!text) {
                  result = { status: 'EINVAL', errno: -22, data: null, message: 'Empty payload' };
                  break;
                }
                const bytes = text.length;
                this.sockets.messages.push({ time: nowTimeStr(), from: sender.name, text });
                this.sockets.packetTrace.unshift({
                  time: nowTimeStr(),
                  call: `send(fd=${sender.fd}, "${text.slice(0, 24)}${text.length > 24 ? '...' : ''}", ${bytes}B)`,
                  detail: `broadcast recv() to ${this.sockets.clients.filter(c => c.connected && c.id !== sender.id).length} peers`,
                  status: 'OK',
                });
                if (this.sockets.packetTrace.length > 60) this.sockets.packetTrace.pop();
                result = { status: 'OK', errno: 0, data: { bytes }, message: `Sent ${bytes}B from ${sender.name}` };
              } else if (op === 'CONNECT') {
                if (this.sockets.serverState !== 'LISTENING') {
                  result = { status: 'ENODEV', errno: -19, data: null, message: 'Connection refused (server stopped)' };
                  break;
                }
                let client = this.sockets.clients.find(c => c.id === args.clientId);
                if (!client) {
                  const id = this.sockets.nextClientId++;
                  const tid = this.sockets.nextThreadId++;
                  const fd = 10 + id;
                  const names = ['charlie', 'diana', 'eve', 'frank', 'grace', 'heidi'];
                  const cname = args.name || names[(id - 3) % names.length] || `client${id}`;
                  client = { id, name: cname, fd, tid, connected: true, ip: `127.0.0.1:${51040 + id}` };
                  this.sockets.clients.push(client);
                } else {
                  client.connected = true;
                }
                this.sockets.packetTrace.unshift({
                  time: nowTimeStr(),
                  call: `accept(3) -> fd=${client.fd}`,
                  detail: `pthread_create(tid=${client.tid}) [${client.name}]`,
                  status: 'OK',
                });
                this.sockets.messages.push({ time: nowTimeStr(), from: 'SERVER', text: `${client.name} connected (${client.ip}, tid=${client.tid})`, sys: true });
                result = { status: 'OK', errno: 0, data: client, message: `Connected ${client.name} (fd=${client.fd})` };
              } else if (op === 'DISCONNECT') {
                const client = this.sockets.clients.find(c => c.id === args.clientId);
                if (!client) {
                  result = { status: 'ENOENT', errno: -2, data: null, message: 'Client not found' };
                } else {
                  client.connected = false;
                  this.sockets.packetTrace.unshift({
                    time: nowTimeStr(),
                    call: `close(fd=${client.fd})`,
                    detail: `pthread_exit(tid=${client.tid}) [${client.name}]`,
                    status: 'OK',
                  });
                  this.sockets.messages.push({ time: nowTimeStr(), from: 'SERVER', text: `${client.name} disconnected`, sys: true });
                  result = { status: 'OK', errno: 0, data: client, message: `Disconnected ${client.name}` };
                }
              } else {
                result = {
                  status: 'OK', errno: 0,
                  data: { state: this.sockets.serverState, activeClients: this.sockets.clients.filter(c => c.connected).length },
                  message: `Socket server ${this.sockets.serverState}`
                };
              }
              this.emit('sockets');
              break;
            }

            /* SYS_AUTH (9): audit / auth verification trap */
            case SYSCALL.SYS_AUTH: {
              const action = args.action || 'STATUS';
              if (action === 'UNLOCK_ALL') {
                Object.values(this.users).forEach(u => {
                  u.failedAttempts = 0;
                  u.locked = false;
                });
                this.logAudit('ACCOUNT_UNLOCKED', username, 'All locked accounts reset by admin', 'SUCCESS');
                this.emit('users');
                result = { status: 'OK', errno: 0, data: { unlocked: true }, message: 'Unlocked all accounts' };
              } else if (action === 'UNLOCK_USER') {
                const target = this.users[args.target];
                if (!target) {
                  result = { status: 'ENOENT', errno: -2, data: null, message: 'User not found' };
                } else {
                  target.failedAttempts = 0;
                  target.locked = false;
                  this.logAudit('ACCOUNT_UNLOCKED', username, `Unlocked account '${target.username}'`, 'SUCCESS');
                  this.emit('users');
                  result = { status: 'OK', errno: 0, data: { target: target.username }, message: `Unlocked ${target.username}` };
                }
              } else {
                result = { status: 'OK', errno: 0, data: { user: username, uid: user ? user.uid : -1 }, message: `Auth check (${action})` };
              }
              break;
            }

            /* SYS_INSMOD (10): load/unload kernel module */
            case SYSCALL.SYS_INSMOD: {
              const modName = (args.module || '').replace('/dev/', '').trim();
              const action = (args.action || 'load').toLowerCase();
              const mod = this.modules[modName];
              if (!mod) {
                result = { status: 'ENOENT', errno: -2, data: null, message: `Kernel module not found: ${modName}` };
                break;
              }
              if (user && user.uid !== 0 && args.requireRoot) {
                this.logAudit('PERM_DENIED', username, `SYS_INSMOD(${action} ${modName}) requires root`, 'ALERT');
                result = { status: 'EACCES', errno: -13, data: null, message: 'Operation not permitted (requires root)' };
                break;
              }
              if (action === 'unload' || action === 'rmmod') {
                if (!mod.loaded) {
                  result = { status: 'EINVAL', errno: -22, data: null, message: `Module ${modName} already unloaded` };
                } else {
                  mod.loaded = false;
                  mod.openFds = [];
                  this.logDmesg(`${modName}: rmmod unregistered character device major=${mod.major}`, 'WARN');
                  this.logAudit('DRIVER_UNLOAD', username, `Unloaded LKM ${modName} (${mod.devPath})`, 'WARN');
                  this.emit('drivers');
                  result = { status: 'OK', errno: 0, data: { module: modName, loaded: false }, message: `Unloaded ${modName}` };
                }
              } else {
                if (mod.loaded) {
                  result = { status: 'EEXIST', errno: -17, data: null, message: `Module ${modName} already loaded` };
                } else {
                  mod.loaded = true;
                  this.logDmesg(`${modName}: insmod registered character device major=${mod.major} minor=${mod.minor} (${mod.devPath})`);
                  this.logAudit('DRIVER_LOAD', username, `Loaded LKM ${modName} (${mod.devPath})`, 'SUCCESS');
                  this.emit('drivers');
                  result = { status: 'OK', errno: 0, data: { module: modName, loaded: true }, message: `Loaded ${modName} (${mod.devPath})` };
                }
              }
              break;
            }

            default:
              result = { status: 'EINVAL', errno: -22, data: null, message: `Unrecognized syscall number: ${code}` };
          }
        } catch (err) {
          result = { status: 'EINVAL', errno: -22, data: null, message: `Kernel trap error: ${err.message}` };
        }

        // Record into live Syscall Log
        const argsSummary = Object.entries(args || {})
          .map(([k, v]) => {
            const sv = typeof v === 'string' && v.length > 26 ? v.slice(0, 26) + '...' : String(v);
            return `${k}=${sv}`;
          })
          .join(', ') || 'none';

        this.syscallLog.unshift({
          id: this.nextSyscallId++,
          time: nowTimeStr(),
          pid,
          user: username,
          code: Number(code),
          name,
          argsSummary,
          status: result.status,
          errno: result.errno,
          message: result.message,
        });
        if (this.syscallLog.length > 250) this.syscallLog.pop();

        // Update taskbar syscall counter
        const counterEl = document.getElementById('tray-syscall-count');
        if (counterEl) counterEl.textContent = String(this.nextSyscallId - 1);

        this.emit('syscalls');
        return result;
      },

      /* -------------------------------------------------------------------
       * AUTHENTICATION METHODS (Async SHA-256)
       * ------------------------------------------------------------------- */
      async authenticate(username, password) {
        const uname = username.trim().toLowerCase();
        const user = this.users[uname];
        if (!user) {
          this.syscall(SYSCALL.SYS_AUTH, { action: 'LOGIN_FAIL', username: uname }, 1);
          this.logAudit('LOGIN_FAIL', uname || 'unknown', 'Authentication failed: unknown user', 'WARN');
          return { ok: false, reason: 'Invalid username or password.', locked: false };
        }
        if (user.locked) {
          this.syscall(SYSCALL.SYS_AUTH, { action: 'LOGIN_BLOCKED', username: uname }, 1);
          this.logAudit('ACCOUNT_LOCKED', uname, 'Login attempt blocked — account is locked', 'ALERT');
          return { ok: false, reason: `Account '${uname}' is LOCKED after 5 failed attempts.`, locked: true };
        }

        const hash = await hashPasswordSHA256(password);
        if (hash !== user.passwordHash) {
          user.failedAttempts += 1;
          if (user.failedAttempts >= 5) {
            user.locked = true;
            this.syscall(SYSCALL.SYS_AUTH, { action: 'LOCKOUT', username: uname }, 1);
            this.logAudit('ACCOUNT_LOCKED', uname, 'Account locked after 5 consecutive failed logins', 'ALERT');
            this.emit('users');
            return { ok: false, reason: `Account '${uname}' LOCKED (5/5 failed attempts).`, locked: true };
          }
          this.syscall(SYSCALL.SYS_AUTH, { action: 'LOGIN_FAIL', username: uname, attempt: user.failedAttempts }, 1);
          this.logAudit('LOGIN_FAIL', uname, `Wrong password (attempt ${user.failedAttempts}/5)`, 'WARN');
          this.emit('users');
          return { ok: false, reason: `Invalid credentials (${user.failedAttempts}/5 failed attempts).`, locked: false };
        }

        // Success
        user.failedAttempts = 0;
        this.currentUser = user;
        this.syscall(SYSCALL.SYS_AUTH, { action: 'LOGIN_OK', username: uname }, 1);
        this.logAudit('LOGIN_SUCCESS', uname, `User '${uname}' (uid=${user.uid}) authenticated via SHA-256`, 'SUCCESS');
        this.emit('users');
        return { ok: true, user };
      },

      async registerUser(username, password, role = 'user') {
        const uname = username.trim().toLowerCase();
        if (!/^[a-z0-9_]{2,16}$/.test(uname)) {
          return { ok: false, reason: 'Username must be 2-16 lowercase letters/digits.' };
        }
        if (this.users[uname]) {
          return { ok: false, reason: `User '${uname}' already exists.` };
        }
        if (password.length < 4) {
          return { ok: false, reason: 'Password must be at least 4 characters.' };
        }
        const hash = await hashPasswordSHA256(password);
        const uid = role === 'admin' ? 0 : 1000 + Object.keys(this.users).length;
        const gid = role === 'admin' ? 0 : 100;
        this.users[uname] = {
          username: uname,
          uid,
          gid,
          role,
          passwordHash: hash,
          failedAttempts: 0,
          locked: false,
          createdAt: nowTimestamp(),
        };
        this.syscall(SYSCALL.SYS_AUTH, { action: 'REGISTER', username: uname, role }, 1);
        this.logAudit('USER_REGISTERED', uname, `Created user '${uname}' (uid=${uid}, role=${role})`, 'SUCCESS');
        this.emit('users');
        return { ok: true, user: this.users[uname] };
      },

      logout() {
        const uname = this.currentUser ? this.currentUser.username : 'unknown';
        this.logAudit('LOGOUT', uname, `User '${uname}' locked/logged out of desktop session`, 'INFO');
        this.currentUser = null;
        DesktopUI.toggleStartMenu(false);
        document.getElementById('desktop-env').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
        document.getElementById('login-password').value = '';
        AuthUI.showFeedback('login', `Session locked. Signed out from '${uname}'.`, 'info');
      }
    };

     * AUTHENTICATION SCREEN UI CONTROLLER
     * ======================================================================= */
    const AuthUI = {
      setTab(tab) {
        const loginForm = document.getElementById('login-form');
        const regForm = document.getElementById('register-form');
        const tLogin = document.getElementById('tab-login-btn');
        const tReg = document.getElementById('tab-register-btn');
        if (tab === 'login') {
          loginForm.classList.remove('hidden');
          regForm.classList.add('hidden');
          tLogin.classList.add('border-cobaltbright', 'text-white');
          tLogin.classList.remove('border-transparent', 'text-slate-400');
          tReg.classList.remove('border-cobaltbright', 'text-white');
          tReg.classList.add('border-transparent', 'text-slate-400');
        } else {
          regForm.classList.remove('hidden');
          loginForm.classList.add('hidden');
          tReg.classList.add('border-cobaltbright', 'text-white');
          tReg.classList.remove('border-transparent', 'text-slate-400');
          tLogin.classList.remove('border-cobaltbright', 'text-white');
          tLogin.classList.add('border-transparent', 'text-slate-400');
        }
      },

      quickFill(user, pass) {
        document.getElementById('login-username').value = user;
        document.getElementById('login-password').value = pass;
        this.hideFeedback('login');
      },

      showFeedback(form, msg, type = 'error') {
        const el = document.getElementById(`${form}-feedback`);
        const styles = {
          error: 'bg-red-950/60 border-red-500/50 text-red-300',
          success: 'bg-lime-950/50 border-acid/50 text-lime-300',
          info: 'bg-blue-950/50 border-cobaltbright/50 text-blue-300',
        };
        el.className = `rounded-lg p-3 text-xs font-mono border ${styles[type]}`;
        el.textContent = msg;
        el.classList.remove('hidden');
      },

      hideFeedback(form) {
        document.getElementById(`${form}-feedback`).classList.add('hidden');
      },

      async handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('login-username').value;
        const pass = document.getElementById('login-password').value;
        const res = await Kernel.authenticate(user, pass);
        const unlockBox = document.getElementById('login-unlock-box');
        if (!res.ok) {
          this.showFeedback('login', res.reason, 'error');
          if (res.locked) unlockBox.classList.remove('hidden');
          return;
        }
        unlockBox.classList.add('hidden');
        this.hideFeedback('login');
        DesktopUI.enterDesktop();
      },

      async handleRegister(e) {
        e.preventDefault();
        const user = document.getElementById('reg-username').value;
        const pass = document.getElementById('reg-password').value;
        const role = document.getElementById('reg-role').value;
        const res = await Kernel.registerUser(user, pass, role);
        if (!res.ok) {
          this.showFeedback('reg', res.reason, 'error');
          return;
        }
        await Kernel.authenticate(user, pass);
        document.getElementById('reg-username').value = '';
        document.getElementById('reg-password').value = '';
        this.hideFeedback('reg');
        DesktopUI.enterDesktop();
      },

      resetAllLockouts() {
        Kernel.syscall(SYSCALL.SYS_AUTH, { action: 'UNLOCK_ALL' }, 1);
        document.getElementById('login-unlock-box').classList.add('hidden');
        this.showFeedback('login', 'Admin unlock executed: all account lockouts cleared.', 'success');
      }
    };

        defaultW: 850,
        defaultH: 570,
      },
      disk: {

        defaultW: 880,

      security: {

        icon: `<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>`,
        defaultW: 850,
        defaultH: 560,
